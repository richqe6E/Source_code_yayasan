<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manajemen Kelas - Yayasan At Tarbiyyah Wijaya Kusuma Samarinda</title>
  <meta name="robots" content="noindex, nofollow, noarchive">

  <!-- Favicon / Brand Logo -->
  <link rel="icon" type="image/png" href="/images/logo.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png">
  <link rel="shortcut icon" type="image/x-icon" href="/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter','system-ui','sans-serif'] }, colors: { primary: { 50:'#F0F9FF',500:'#0EA5E9',600:'#0284C7',700:'#0369A1',800:'#075985',900:'#0C4A6E' } } } } }
  </script>
  <link rel="stylesheet" href="../../public/css/style.css">
</head>
<body class="font-sans bg-gray-50 text-gray-800">
  <div id="app-shell"></div>

  <main class="p-4 sm:p-6 lg:p-8">
    <div class="flex flex-col sm:flex-row sm:items-end sm:justify-between gap-3 mb-4">
      <h2 class="text-base font-semibold text-gray-900">Daftar Kelas</h2>
      <button onclick="openClassModal()" class="px-4 py-2 bg-primary-600 text-white text-sm font-medium rounded-md hover:bg-primary-700">+ Tambah Kelas</button>
    </div>

    <div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-4" id="classes-grid">
      <div class="text-center text-sm text-gray-500 col-span-full">Memuat...</div>
    </div>
  </main>

  <div id="class-modal" class="hidden fixed inset-0 z-50 bg-gray-900 bg-opacity-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-lg w-full max-w-md">
      <div class="px-5 py-4 border-b border-gray-200 flex justify-between items-center">
        <h3 id="modal-title" class="text-base font-semibold">Tambah Kelas</h3>
        <button onclick="closeClassModal()" class="text-gray-400 hover:text-gray-600">&times;</button>
      </div>
      <form id="class-form" class="p-5 space-y-3">
        <input type="hidden" id="class-id">
        <div><label class="block text-sm font-medium text-gray-700 mb-1">Nama Kelas *</label><input id="form-name" type="text" required placeholder="Mis. TK A" class="w-full px-3 py-2 border border-gray-300 rounded-md text-sm"></div>
        <div><label class="block text-sm font-medium text-gray-700 mb-1">Tingkat</label>
          <select id="form-grade" class="w-full px-3 py-2 border border-gray-300 rounded-md text-sm">
            <option value="PAUD">PAUD</option>
            <option value="TK">TK</option>
            <option value="TK_A">TK A</option>
            <option value="TK_B">TK B</option>
            <option value="TPQ">TPQ</option>
          </select>
        </div>
        <div><label class="block text-sm font-medium text-gray-700 mb-1">Tahun Ajaran *</label><input id="form-year" type="text" required placeholder="2026/2027" class="w-full px-3 py-2 border border-gray-300 rounded-md text-sm"></div>
        <div><label class="block text-sm font-medium text-gray-700 mb-1">Wali Kelas</label>
          <select id="form-teacher" class="w-full px-3 py-2 border border-gray-300 rounded-md text-sm"><option value="">-</option></select>
        </div>
        <div><label class="block text-sm font-medium text-gray-700 mb-1">Kapasitas</label><input id="form-capacity" type="number" min="1" max="50" value="20" class="w-full px-3 py-2 border border-gray-300 rounded-md text-sm"></div>
        <div class="flex justify-end gap-2 pt-3 border-t border-gray-200">
          <button type="button" onclick="closeClassModal()" class="px-4 py-2 border border-gray-300 text-gray-700 text-sm rounded-md hover:bg-gray-50">Batal</button>
          <button type="submit" class="px-4 py-2 bg-primary-600 text-white text-sm rounded-md hover:bg-primary-700">Simpan</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../../shared/js/supabase-config.js"></script>
  <script src="../../shared/js/auth.js"></script>
  <script src="../../shared/js/api.js"></script>
  <script src="../../shared/js/shell.js"></script>
  <script>
    requireAuth('super_admin,admin_tu');

    const MENU = Shell.ADMIN_MENU;

    Shell.init({
      menu: MENU,
      active: 'classes.html',
      portalLabel: 'Portal Admin',
      title: 'Manajemen Kelas',
      subtitle: 'Rombongan belajar & wali kelas',
      showRefresh: true,
      onRefresh: loadClasses
    });

    function skeletonCards(count = 3) {
      return Array.from({length: count}).map(() => `
        <div class="bg-white border border-gray-200 rounded-lg p-5">
          <div class="skeleton h-5 w-28 rounded mb-2"></div>
          <div class="skeleton h-3 w-36 rounded mb-4"></div>
          <div class="space-y-2">
            <div class="skeleton h-4 w-full rounded"></div>
            <div class="skeleton h-4 w-3/4 rounded"></div>
          </div>
        </div>
      `).join('');
    }

    function escapeAttr(str) {
      if (str === undefined || str === null) return '';
      return String(str).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[m]);
    }

    async function loadClasses() {
      Shell.hideError();
      const stopSpin = Shell.startRefresh();
      const grid = document.getElementById('classes-grid');
      grid.innerHTML = skeletonCards(3);

      try {
        const res = await apiCall('classes', 'list', { per_page: 100 });
        if (!res.success) {
          Shell.showError(res.message || 'Gagal memuat daftar kelas');
          grid.innerHTML = `<div class="col-span-full text-center text-sm text-red-600">${res.message || 'Gagal'}</div>`;
          return;
        }
        const items = Array.isArray(res.data) ? res.data : ((res.data && (res.data.items || res.data.classes)) || []);
        if (items.length === 0) {
          grid.innerHTML = '<div class="col-span-full text-center text-sm text-gray-500">Belum ada kelas</div>';
          return;
        }
        grid.innerHTML = items.map(c => `
          <div class="bg-white border border-gray-200 rounded-lg p-5 min-w-0">
            <div class="flex justify-between items-start mb-2 gap-2">
              <div class="min-w-0">
                <div class="text-base font-semibold text-gray-900 truncate">${escapeAttr(c.name)}</div>
                <div class="text-xs text-gray-500 truncate tabular-nums">${escapeAttr(c.academic_year)} • ${escapeAttr(c.grade_level || c.level || '-')}</div>
              </div>
              <span class="px-2 py-0.5 text-xs rounded shrink-0 font-medium bg-primary-100 text-primary-700">Aktif</span>
            </div>
            <div class="space-y-1 text-sm text-gray-600 mt-3">
              <div class="truncate">👨‍🏫 Wali: <span class="text-gray-900 font-medium">${escapeAttr(c.teacher_name || c.homeroom_teacher_name || '-')}</span></div>
              <div class="truncate">👥 Siswa: <span class="text-gray-900 font-medium tabular-nums">${c.student_count || 0} / ${c.capacity || 20}</span></div>
            </div>
            <div class="flex gap-3 mt-4 pt-3 border-t border-gray-100 text-sm">
              <button onclick="editClass('${c.id}')" class="text-primary-700 hover:text-primary-900 font-medium">Edit</button>
              <button onclick="manageStudents('${c.id}')" class="text-gray-700 hover:text-gray-900 font-medium">Siswa</button>
              <button onclick="deleteClass('${c.id}')" class="text-red-700 hover:text-red-900 ml-auto font-medium">Hapus</button>
            </div>
          </div>`).join('');
      } catch (e) {
        Shell.showError('Tidak dapat terhubung ke server.');
      } finally {
        stopSpin();
      }
    }

    async function loadTeachersOptions() {
      const res = await apiCall('teachers', 'list', { per_page: 100, is_active: 'true' });
      if (res.success) {
        const teachers = Array.isArray(res.data) ? res.data : ((res.data && (res.data.items || res.data.teachers)) || []);
        document.getElementById('form-teacher').innerHTML = '<option value="">- Tanpa Wali Kelas -</option>' + teachers.map(t => {
          const name = t.full_name || t.name || '-';
          const nip = t.nip ? ` (NIP: ${escapeAttr(t.nip)})` : '';
          return `<option value="${t.id}">${escapeAttr(name)}${nip}</option>`;
        }).join('');
      }
    }

    function openClassModal(cls = null) {
      document.getElementById('class-modal').classList.remove('hidden');
      document.getElementById('class-form').reset();
      document.getElementById('class-id').value = '';
      if (cls) {
        document.getElementById('modal-title').textContent = 'Edit Kelas';
        document.getElementById('class-id').value = cls.id;
        document.getElementById('form-name').value = cls.name;
        document.getElementById('form-grade').value = cls.grade_level || 'PAUD';
        document.getElementById('form-year').value = cls.academic_year;
        document.getElementById('form-teacher').value = cls.homeroom_teacher_id || '';
        document.getElementById('form-capacity').value = cls.capacity || 20;
      } else {
        document.getElementById('modal-title').textContent = 'Tambah Kelas';
      }
    }
    function closeClassModal() { document.getElementById('class-modal').classList.add('hidden'); }

    async function editClass(id) {
      const res = await apiCall('classes', 'get', { id });
      if (res.success) openClassModal(res.data);
    }

    async function deleteClass(id) {
      if (!confirm('Hapus kelas ini? (soft delete)')) return;
      const res = await apiCall('classes', 'delete', { id });
      showToast(res.message, res.success ? 'success' : 'error');
      if (res.success) loadClasses();
    }

    function manageStudents(id) {
      window.location.href = `students.html?class_id=${id}`;
    }

    document.getElementById('class-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const id = document.getElementById('class-id').value;
      const data = {
        name: document.getElementById('form-name').value,
        grade_level: document.getElementById('form-grade').value,
        academic_year: document.getElementById('form-year').value,
        homeroom_teacher_id: document.getElementById('form-teacher').value,
        capacity: parseInt(document.getElementById('form-capacity').value) || 20
      };
      const res = await apiCall('classes', id ? 'update' : 'create', id ? { id, ...data } : data);
      showToast(res.message, res.success ? 'success' : 'error');
      if (res.success) { closeClassModal(); loadClasses(); }
    });

    (async () => { await loadTeachersOptions(); await loadClasses(); })();
  </script>
</body>
</html>
