<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Konten - Yayasan At Tarbiyyah Wijaya Kusuma Samarinda</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter','system-ui','sans-serif'] }, colors: { primary: { 50:'#F0F9FF',500:'#0EA5E9',600:'#0284C7',700:'#0369A1',800:'#075985',900:'#0C4A6E' } } } } }
  </script>
  <link rel="stylesheet" href="../../public/css/style.css">
</head>
<body class="font-sans bg-gray-50 text-gray-800">
  <div id="app-shell"></div>

  <main class="p-4 sm:p-6 lg:p-8">
    <div class="border-b border-gray-200 mb-4 overflow-x-auto">
      <nav class="flex gap-1 -mb-px min-w-max">
        <button data-tab="news" onclick="switchTab('news')" class="ct-tab px-4 py-2 text-sm font-medium border-b-2 border-primary-600 text-primary-700 whitespace-nowrap">Berita</button>
        <button data-tab="announcements" onclick="switchTab('announcements')" class="ct-tab px-4 py-2 text-sm font-medium border-b-2 border-transparent text-gray-600 hover:text-gray-900 whitespace-nowrap">Pengumuman</button>
        <button data-tab="events" onclick="switchTab('events')" class="ct-tab px-4 py-2 text-sm font-medium border-b-2 border-transparent text-gray-600 hover:text-gray-900 whitespace-nowrap">Agenda</button>
        <button data-tab="gallery" onclick="switchTab('gallery')" class="ct-tab px-4 py-2 text-sm font-medium border-b-2 border-transparent text-gray-600 hover:text-gray-900 whitespace-nowrap">Galeri</button>
        <button data-tab="school" onclick="switchTab('school')" class="ct-tab px-4 py-2 text-sm font-medium border-b-2 border-transparent text-gray-600 hover:text-gray-900 whitespace-nowrap">Identitas &amp; Medsos Sekolah</button>
      </nav>
    </div>
    <div id="content-area"></div>
  </main>

  <!-- Modal Tambah Konten -->
  <div id="content-modal" class="hidden fixed inset-0 z-50 bg-gray-900 bg-opacity-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-lg w-full max-w-lg max-h-[90vh] overflow-y-auto shadow-xl">
      <div class="px-5 py-4 border-b border-gray-200 flex justify-between items-center bg-gray-50">
        <h3 id="modal-content-title" class="text-base font-bold text-gray-900">Tambah Konten</h3>
        <button type="button" onclick="closeContentModal()" class="text-gray-400 hover:text-gray-600 text-xl font-bold">&times;</button>
      </div>
      <form id="content-form" class="p-5 space-y-4">
        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-1">Judul *</label>
          <input id="form-title" type="text" required class="w-full px-3 py-2 border border-gray-300 rounded-md text-sm focus:ring-2 focus:ring-primary-500 focus:border-transparent" placeholder="Contoh: Peringatan Maulid Nabi atau Info Libur Sekolah">
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-gray-700 mb-1">Kategori</label>
            <input id="form-category" type="text" class="w-full px-3 py-2 border border-gray-300 rounded-md text-sm focus:ring-2 focus:ring-primary-500 focus:border-transparent" placeholder="Misal: Akademik, Prestasi">
          </div>
          <div id="event-date-container" class="hidden">
            <label class="block text-xs font-semibold text-gray-700 mb-1">Tanggal Acara *</label>
            <input id="form-event-date" type="date" class="w-full px-3 py-2 border border-gray-300 rounded-md text-sm focus:ring-2 focus:ring-primary-500 focus:border-transparent">
          </div>
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-1.5">Foto / Cover (Opsional)</label>
          
          <!-- Mode Switcher -->
          <div class="flex items-center gap-1.5 p-1 bg-gray-100 rounded-lg w-fit border border-gray-200 mb-2">
            <button type="button" id="tab-cnt-file" onclick="setContentImgMode('file')" class="px-3 py-1 rounded text-xs font-bold transition bg-white text-gray-800 shadow-sm flex items-center gap-1.5">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
              <span>1. Upload dari Galeri / Folder</span>
            </button>
            <button type="button" id="tab-cnt-url" onclick="setContentImgMode('url')" class="px-3 py-1 rounded text-xs font-semibold text-gray-500 hover:text-gray-800 transition flex items-center gap-1.5">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"/></svg>
              <span>2. Gunakan Link / URL Gambar</span>
            </button>
          </div>

          <!-- Mode File -->
          <div id="cnt-file-wrap" class="flex items-center gap-3">
            <label class="inline-flex items-center gap-2 px-3 py-2 border border-gray-300 rounded-md text-xs font-medium text-gray-700 bg-white hover:bg-gray-50 cursor-pointer">
              <svg class="w-4 h-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
              <span id="form-image-label">Pilih Foto dari Galeri / Folder</span>
              <input id="form-image-file" type="file" accept="image/*" class="hidden">
            </label>
            <button type="button" id="form-image-clear" class="hidden text-xs text-red-600 hover:text-red-800 font-medium">Hapus</button>
          </div>

          <!-- Mode URL -->
          <div id="cnt-url-wrap" class="hidden space-y-1">
            <input type="url" id="form-image-url-input" oninput="onContentUrlChanged()" class="w-full px-3 py-2 border border-gray-300 rounded-md text-xs font-mono focus:ring-2 focus:ring-primary-500" placeholder="https://images.unsplash.com/... atau https://...">
            <p class="text-[11px] text-gray-400">Masukkan link gambar langsung. Foto yang di-upload akan otomatis dikosongkan.</p>
          </div>

          <!-- Live Preview -->
          <div id="form-image-preview-wrap" class="hidden mt-2">
            <div class="relative w-32 h-32 rounded-lg overflow-hidden border border-gray-200 bg-gray-100 shadow-sm">
              <img id="form-image-preview" alt="preview" class="w-full h-full object-cover">
            </div>
          </div>
          <input id="form-image-url" type="hidden">
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-1">Ringkasan Singkat (Excerpt)</label>
          <input id="form-excerpt" type="text" class="w-full px-3 py-2 border border-gray-300 rounded-md text-sm focus:ring-2 focus:ring-primary-500 focus:border-transparent" placeholder="1-2 kalimat pengantar">
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-1">Isi Konten Lengkap *</label>
          <textarea id="form-body" rows="4" required class="w-full px-3 py-2 border border-gray-300 rounded-md text-sm focus:ring-2 focus:ring-primary-500 focus:border-transparent" placeholder="Tulis rincian berita, pengumuman, atau agenda secara lengkap..."></textarea>
        </div>
        <div class="flex items-center gap-2 p-3 bg-blue-50 border border-blue-100 rounded-md">
          <input id="form-published" type="checkbox" checked class="rounded text-primary-600 focus:ring-primary-500 h-4 w-4">
          <label for="form-published" class="text-xs text-blue-900 font-medium">Langsung publikasikan ke website utama dan portal</label>
        </div>
        <div class="flex justify-end gap-2 pt-3 border-t border-gray-200">
          <button type="button" onclick="closeContentModal()" class="px-4 py-2 border border-gray-300 text-gray-700 text-sm font-medium rounded-md hover:bg-gray-50">Batal</button>
          <button id="btn-submit-content" type="submit" class="px-4 py-2 bg-primary-600 text-white text-sm font-semibold rounded-md hover:bg-primary-700 shadow-sm">Simpan &amp; Publikasikan</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../../shared/js/supabase-config.js"></script>
  <script src="../../shared/js/auth.js"></script>
  <script src="../../shared/js/api.js"></script>
  <script src="../../shared/js/shell.js"></script>
  <script>
    requireAuth('super_admin,admin_tu');

    const MENU = Shell.ADMIN_MENU;

    Shell.init({
      menu: MENU,
      active: 'content.html',
      portalLabel: 'Portal Admin',
      title: 'Manajemen Konten',
      subtitle: 'Berita, pengumuman, agenda & galeri yayasan',
      showRefresh: true,
      onRefresh: renderTab
    });

    let currentTab = 'news';

    async function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.ct-tab').forEach(b => { b.classList.remove('border-primary-600','text-primary-700'); b.classList.add('border-transparent','text-gray-600'); });
      document.querySelector(`[data-tab="${tab}"]`).classList.add('border-primary-600','text-primary-700');
      document.querySelector(`[data-tab="${tab}"]`).classList.remove('border-transparent','text-gray-600');
      await renderTab();
    }

    async function renderTab() {
      Shell.hideError();
      const stopSpin = Shell.startRefresh();
      const labelMap = { news: 'Berita', announcements: 'Pengumuman', events: 'Agenda' };
      const area = document.getElementById('content-area');
      area.innerHTML = `
        <div class="bg-white border border-gray-200 rounded-lg p-5 space-y-4">
          <div class="skeleton h-5 w-48 rounded"></div>
          <div class="skeleton h-4 w-full rounded"></div>
          <div class="skeleton h-4 w-3/4 rounded"></div>
        </div>
      `;
      try {
        if (currentTab === 'school') return await renderSchoolSettings();
        if (currentTab === 'gallery') return await renderGallery();
        const res = await apiCall(currentTab, 'list', { per_page: 50 });
        if (!res.success) {
          Shell.showError(res.message || 'Gagal memuat konten');
          area.innerHTML = `<div class="bg-red-50 border border-red-200 p-4 rounded-md text-sm text-red-700">${res.message || 'Gagal'}</div>`;
          return;
        }
        const items = Array.isArray(res.data) ? res.data : ((res.data && res.data.items) || []);
        if (items.length === 0) {
          area.innerHTML = `
            <div class="flex justify-between items-center mb-3 gap-2">
              <h3 class="text-sm font-semibold text-gray-700 truncate">${labelMap[currentTab]} (0)</h3>
              <button onclick="openCreateModal()" class="px-3 py-1.5 bg-primary-600 text-white text-sm font-medium rounded-md hover:bg-primary-700 shrink-0">+ Tambah Konten</button>
            </div>
            <div class="bg-white border border-gray-200 rounded-lg text-center text-sm text-gray-500 py-12">Belum ada konten ${labelMap[currentTab].toLowerCase()}</div>
          `;
          return;
        }

        area.innerHTML = `
          <div class="flex justify-between items-center mb-3 gap-2">
            <h3 class="text-sm font-semibold text-gray-700 truncate">${labelMap[currentTab]} (${items.length})</h3>
            <button onclick="openCreateModal()" class="px-3 py-1.5 bg-primary-600 text-white text-sm font-medium rounded-md hover:bg-primary-700 shrink-0">+ Tambah Konten</button>
          </div>
          <div class="bg-white border border-gray-200 rounded-lg divide-y divide-gray-200">
            ${items.map(item => {
              const isPub = item.status ? (item.status === 'published' || item.status === 'pinned') : (item.is_published === true || item.is_published === 'TRUE');
              return `
              <div class="p-4 flex justify-between items-start gap-3 min-w-0">
                <div class="flex-1 min-w-0">
                  <div class="flex items-center gap-2 mb-1 min-w-0">
                    <div class="text-sm font-medium text-gray-900 truncate">${item.title}</div>
                    <span class="px-2 py-0.5 text-xs rounded shrink-0 font-medium ${isPub ? 'bg-primary-100 text-primary-700' : 'bg-gray-100 text-gray-700'}">${isPub ? 'Published' : 'Draft'}</span>
                  </div>
                  <div class="text-xs text-gray-500 truncate tabular-nums">${formatDate(item.created_at || item.published_at)}${item.event_date ? ' • ' + formatDate(item.event_date) : ''}${item.author_name ? ' • ' + item.author_name : ''}${item.category ? ' • ' + item.category : ''}</div>
                  ${item.excerpt ? `<div class="text-xs text-gray-600 mt-1 line-clamp-2">${item.excerpt}</div>` : ''}
                </div>
                <div class="flex gap-3 text-sm shrink-0 whitespace-nowrap">
                  <button onclick="togglePublish('${item.id}', ${!isPub})" class="text-primary-700 hover:text-primary-900 font-medium">${isPub ? 'Tarik (Draft)' : 'Terbitkan (Publish)'}</button>
                  <button onclick="deleteItem('${item.id}')" class="text-red-700 hover:text-red-900 font-medium">Hapus</button>
                </div>
              </div>
              `;
            }).join('')}
          </div>
        `;
      } catch (e) {
        Shell.showError('Tidak dapat terhubung ke server.');
      } finally {
        stopSpin();
      }
    }

    async function renderGallery() {
      const res = await apiCall('gallery', 'list', { per_page: 50 });
      const area = document.getElementById('content-area');
      if (!res.success) { area.innerHTML = `<div class="bg-red-50 border border-red-200 p-4 rounded-md text-sm text-red-700">${res.message}</div>`; return; }
      const items = Array.isArray(res.data) ? res.data : ((res.data && res.data.items) || []);
      area.innerHTML = `
        <div class="flex justify-between items-center mb-3 gap-2">
          <h3 class="text-sm font-semibold text-gray-700 truncate">Galeri Foto (${items.length})</h3>
          <button onclick="openCreateModal()" class="px-3 py-1.5 bg-primary-600 text-white text-sm rounded-md hover:bg-primary-700 shrink-0">+ Tambah Foto</button>
        </div>
        ${items.length === 0 ? '<div class="bg-white border border-gray-200 rounded-lg text-center text-sm text-gray-500 py-12">Belum ada foto galeri</div>' : `
        <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-3">
          ${items.map(g => `
            <div class="bg-white border border-gray-200 rounded-lg overflow-hidden group relative">
              <div class="aspect-square bg-gray-100 flex items-center justify-center text-xs text-gray-400 relative">
                ${g.image_url ? `<img src="${g.image_url}" class="w-full h-full object-cover">` : g.title}
                <button onclick="deleteItem('gallery', '${g.id}')" class="absolute top-2 right-2 p-1.5 bg-red-600 hover:bg-red-700 text-white rounded-md shadow text-xs" title="Hapus foto">
                  <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                </button>
              </div>
              <div class="p-2 text-xs text-gray-600 truncate">${g.title}</div>
            </div>
          `).join('')}
        </div>`}`;
    }

    async function togglePublish(id, shouldPublish) {
      const newStatus = shouldPublish ? 'published' : 'draft';
      const res = await apiCall(currentTab, 'update', {
        id,
        status: newStatus,
        is_published: shouldPublish,
        published_at: shouldPublish ? new Date().toISOString() : ''
      });
      showToast(res.message || 'Status berhasil diperbarui', res.success ? 'success' : 'error');
      if (res.success) renderTab();
    }

    async function deleteItem(typeOrId, optionalId) {
      let targetTab = currentTab;
      let targetId = typeOrId;
      if (optionalId !== undefined) {
        targetTab = typeOrId;
        targetId = optionalId;
      }
      if (!confirm('Hapus konten ini?')) return;
      const res = await apiCall(targetTab, 'remove', { id: targetId });
      showToast(res.message || 'Konten dihapus', res.success ? 'success' : 'error');
      if (res.success) renderTab();
    }

    function openCreateModal() {
      document.getElementById('content-modal').classList.remove('hidden');
      document.getElementById('content-form').reset();
      const tabNames = { news: 'Berita', announcements: 'Pengumuman', events: 'Agenda Acara', gallery: 'Foto Galeri' };
      document.getElementById('modal-content-title').textContent = 'Tambah ' + (tabNames[currentTab] || 'Konten');

      const isEvent = currentTab === 'events';
      document.getElementById('event-date-container').classList.toggle('hidden', !isEvent);
      document.getElementById('form-event-date').required = isEvent;

      // Reset image picker state
      contentImgMode = 'file';
      setContentImgMode('file');
      clearContentImage();
    }

    function closeContentModal() {
      document.getElementById('content-modal').classList.add('hidden');
    }

    let contentImgMode = 'file';

    function setContentImgMode(mode) {
      contentImgMode = mode;
      const tabFile = document.getElementById('tab-cnt-file');
      const tabUrl = document.getElementById('tab-cnt-url');
      const wrapFile = document.getElementById('cnt-file-wrap');
      const wrapUrl = document.getElementById('cnt-url-wrap');

      if (mode === 'file') {
        tabFile.className = 'px-3 py-1 rounded text-xs font-bold transition bg-white text-gray-800 shadow-sm flex items-center gap-1.5';
        tabUrl.className = 'px-3 py-1 rounded text-xs font-semibold text-gray-500 hover:text-gray-800 transition flex items-center gap-1.5';
        wrapFile.classList.remove('hidden');
        wrapUrl.classList.add('hidden');

        // Kosongkan URL saat beralih ke file
        document.getElementById('form-image-url-input').value = '';
        const hiddenUrl = document.getElementById('form-image-url');
        if (!document.getElementById('form-image-file').files.length) {
          hiddenUrl.value = '';
          hideContentPreview();
        }
      } else {
        tabUrl.className = 'px-3 py-1 rounded text-xs font-bold transition bg-white text-gray-800 shadow-sm flex items-center gap-1.5';
        tabFile.className = 'px-3 py-1 rounded text-xs font-semibold text-gray-500 hover:text-gray-800 transition flex items-center gap-1.5';
        wrapUrl.classList.remove('hidden');
        wrapFile.classList.add('hidden');

        // Kosongkan File saat beralih ke URL
        const fileInput = document.getElementById('form-image-file');
        fileInput.value = '';
        document.getElementById('form-image-label').textContent = 'Pilih Foto dari Galeri / Folder';
        onContentUrlChanged();
      }
    }

    function onContentUrlChanged() {
      const url = document.getElementById('form-image-url-input').value.trim();
      const hiddenUrl = document.getElementById('form-image-url');
      const previewWrap = document.getElementById('form-image-preview-wrap');
      const previewImg = document.getElementById('form-image-preview');
      const clearBtn = document.getElementById('form-image-clear');

      if (url && (url.startsWith('http://') || url.startsWith('https://') || url.startsWith('images/'))) {
        hiddenUrl.value = url;
        previewImg.src = url;
        previewWrap.classList.remove('hidden');
        clearBtn.classList.remove('hidden');
      } else {
        hiddenUrl.value = '';
        hideContentPreview();
      }
    }

    function hideContentPreview() {
      const previewWrap = document.getElementById('form-image-preview-wrap');
      const previewImg = document.getElementById('form-image-preview');
      const clearBtn = document.getElementById('form-image-clear');
      if (previewWrap) previewWrap.classList.add('hidden');
      if (previewImg) previewImg.src = '';
      if (clearBtn) clearBtn.classList.add('hidden');
    }

    function clearContentImage() {
      const fileInput = document.getElementById('form-image-file');
      const urlInput = document.getElementById('form-image-url-input');
      const hiddenUrl = document.getElementById('form-image-url');
      const label = document.getElementById('form-image-label');

      if (fileInput) fileInput.value = '';
      if (urlInput) urlInput.value = '';
      if (hiddenUrl) hiddenUrl.value = '';
      if (label) label.textContent = 'Pilih Foto dari Galeri / Folder';
      hideContentPreview();
    }

    // File picker -> preview -> base64 ke hidden image_url
    (function bindImagePicker() {
      const fileInput = document.getElementById('form-image-file');
      const previewWrap = document.getElementById('form-image-preview-wrap');
      const previewImg = document.getElementById('form-image-preview');
      const label = document.getElementById('form-image-label');
      const clearBtn = document.getElementById('form-image-clear');
      const hiddenUrl = document.getElementById('form-image-url');
      if (!fileInput) return;

      fileInput.addEventListener('change', function() {
        const f = fileInput.files && fileInput.files[0];
        if (!f) return;
        if (f.size > 5 * 1024 * 1024) {
          showToast('Ukuran foto maksimal 5 MB.', 'error');
          fileInput.value = '';
          return;
        }
        label.textContent = f.name.length > 32 ? f.name.slice(0, 30) + '…' : f.name;
        const reader = new FileReader();
        reader.onload = function(ev) {
          const dataUrl = ev.target.result;
          previewImg.src = dataUrl;
          previewWrap.classList.remove('hidden');
          hiddenUrl.value = dataUrl;
          clearBtn.classList.remove('hidden');
        };
        reader.readAsDataURL(f);
      });

      clearBtn.addEventListener('click', clearContentImage);
    })();

    document.getElementById('content-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      const title = document.getElementById('form-title').value.trim();
      const category = document.getElementById('form-category').value.trim();
      const excerpt = document.getElementById('form-excerpt').value.trim();
      const content = document.getElementById('form-body').value.trim();
      const imageUrl = document.getElementById('form-image-url').value.trim();
      const isPublished = document.getElementById('form-published').checked;
      
      const payload = {
        title,
        content: content || excerpt,
        excerpt: excerpt || content.substring(0, 150),
        category: category || 'Umum',
        status: isPublished ? 'published' : 'draft',
        is_published: isPublished,
        cover_url: imageUrl,
        image_url: imageUrl
      };
      
      if (currentTab === 'events') {
        payload.event_date = document.getElementById('form-event-date').value;
      }
      
      const btn = document.getElementById('btn-submit-content');
      btn.disabled = true;
      btn.textContent = 'Menyimpan...';
      
      try {
        const res = await apiCall(currentTab === 'gallery' ? 'gallery' : currentTab, 'create', payload);
        if (res.success) {
          showToast('Konten berhasil disimpan dan dipublikasikan!', 'success');
          closeContentModal();
          renderTab();
        } else {
          showToast(res.message || 'Gagal menyimpan konten', 'error');
        }
      } catch (err) {
        showToast('Terjadi kesalahan jaringan', 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Simpan & Publikasikan';
      }
    });

    async function renderSchoolSettings() {
      const area = document.getElementById('content-area');
      let school = {};
      try {
        const res = await apiCall('schools', 'get');
        if (res && res.success && res.data) school = res.data;
      } catch (err) {
        console.warn('Gagal ambil data sekolah:', err);
      }

      area.innerHTML = `

      document.getElementById('school-settings-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('btn-save-school');
        btn.disabled = true;
        btn.textContent = 'Menyimpan ke Database...';

        const payload = {
          name: document.getElementById('sch-name').value.trim(),
          address: document.getElementById('sch-address').value.trim(),
          campus_note: document.getElementById('sch-campus-note') ? document.getElementById('sch-campus-note').value.trim() : '',
          maps_url: document.getElementById('sch-maps-url') ? document.getElementById('sch-maps-url').value.trim() : '',
          maps_embed_url: document.getElementById('sch-maps-embed') ? document.getElementById('sch-maps-embed').value.trim() : '',
          phone: document.getElementById('sch-phone').value.trim(),
          email: document.getElementById('sch-email').value.trim(),
          whatsapp_number: document.getElementById('sch-wa').value.trim(),
          instagram_url: document.getElementById('sch-ig').value.trim(),
          youtube_url: document.getElementById('sch-yt').value.trim(),
          facebook_url: document.getElementById('sch-fb').value.trim()
        };

        try {
          const res = await apiCall('schools', 'update', payload);
          if (res.success) {
            // Auto sync ke web_settings
            try {
              await apiCall('web_settings', 'update', {
                school_name: payload.name,
                address: payload.address,
                campus_note: payload.campus_note,
                maps_url: payload.maps_url,
                maps_embed_url: payload.maps_embed_url,
                phone: payload.phone,
                email: payload.email,
                whatsapp: payload.whatsapp_number,
                facebook_url: payload.facebook_url,
                instagram_url: payload.instagram_url,
                youtube_url: payload.youtube_url
              });
            } catch (_) {}

            showToast('Pengaturan sekolah, alamat, dan Google Maps berhasil diperbarui!', 'success');
            sessionStorage.removeItem('siyayasan_school_profile');
            sessionStorage.setItem('siyayasan_school_profile', JSON.stringify({ ...school, ...payload }));
            if (typeof window.hydrateSchoolData === 'function') window.hydrateSchoolData();
          } else {
            showToast(res.message || 'Gagal menyimpan pengaturan sekolah', 'error');
          }
        } catch (err) {
          showToast('Terjadi kesalahan saat menyimpan pengaturan', 'error');
        } finally {
          btn.disabled = false;
          btn.textContent = 'Simpan & Perbarui Website';
        }
      });
    }

    renderTab();
  </script>
