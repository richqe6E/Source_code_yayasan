<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manajemen Guru - Yayasan At Tarbiyyah Wijaya Kusuma Samarinda</title>
  <meta name="robots" content="noindex, nofollow, noarchive">

  <!-- Favicon / Brand Logo -->
  <link rel="icon" type="image/png" href="/images/logo.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png">
  <link rel="shortcut icon" type="image/x-icon" href="/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter','system-ui','sans-serif'] }, colors: { primary: { 50:'#F0F9FF',500:'#0EA5E9',600:'#0284C7',700:'#0369A1',800:'#075985',900:'#0C4A6E' } } } } }
  </script>
  <link rel="stylesheet" href="../../public/css/style.css">
</head>
<body class="font-sans bg-gray-50 text-gray-800">
  <div id="app-shell"></div>

  <main class="p-4 sm:p-6 lg:p-8">
    <div class="bg-white border border-gray-200 rounded-lg p-4 mb-4">
      <div class="flex flex-col sm:flex-row sm:items-end sm:justify-between gap-3 mb-3">
        <div class="flex items-center gap-2.5">
          <h2 class="text-base font-semibold text-gray-900">Daftar Guru</h2>
          <span id="teacher-count-badge" class="px-2.5 py-0.5 rounded-full text-xs font-semibold bg-primary-100 text-primary-800">Memuat data...</span>
        </div>
        <div class="flex items-center gap-2">
          <button onclick="printTeachersReport()" class="px-3 py-1.5 bg-white border border-gray-300 hover:bg-gray-50 text-gray-700 text-xs font-semibold rounded-md shadow-sm transition inline-flex items-center gap-1.5">
            <svg class="w-3.5 h-3.5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"/></svg>
            <span>Cetak Guru</span>
          </button>
          <button onclick="exportTeachersToExcel()" class="px-3 py-1.5 bg-white border border-gray-300 hover:bg-emerald-50 text-emerald-700 text-xs font-semibold rounded-md shadow-sm transition inline-flex items-center gap-1.5">
            <svg class="w-3.5 h-3.5 text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
            <span>Ekspor Excel</span>
          </button>
          <button onclick="openTeacherModal()" class="px-3.5 py-1.5 bg-primary-600 text-white text-xs font-semibold rounded-md hover:bg-primary-700 transition">+ Tambah Guru</button>
        </div>
      </div>
      <div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-3">
        <input id="filter-search" type="text" placeholder="Cari nama/NIP..." class="px-3 py-2 border border-gray-300 rounded-md text-sm">
        <select id="filter-active" class="px-3 py-2 border border-gray-300 rounded-md text-sm">
          <option value="">Semua Status</option>
          <option value="true">Aktif</option>
          <option value="false">Nonaktif</option>
        </select>
        <button onclick="loadTeachers()" class="px-4 py-2 bg-primary-600 text-white text-sm font-medium rounded-md hover:bg-primary-700">Filter</button>
      </div>
    </div>

    <div class="bg-white border border-gray-200 rounded-lg overflow-hidden">
      <div class="overflow-x-auto">
        <table class="min-w-full divide-y divide-gray-200">
          <thead class="bg-gray-50">
            <tr>
              <th class="px-4 py-3 text-left text-xs font-semibold text-gray-600 uppercase">NIP</th>
              <th class="px-4 py-3 text-left text-xs font-semibold text-gray-600 uppercase">Nama</th>
              <th class="px-4 py-3 text-left text-xs font-semibold text-gray-600 uppercase">Email</th>
              <th class="px-4 py-3 text-left text-xs font-semibold text-gray-600 uppercase">Spesialisasi</th>
              <th class="px-4 py-3 text-left text-xs font-semibold text-gray-600 uppercase">Status</th>
              <th class="px-4 py-3 text-left text-xs font-semibold text-gray-600 uppercase">Aksi</th>
            </tr>
          </thead>
          <tbody id="teachers-tbody" class="bg-white divide-y divide-gray-200">
            <tr><td colspan="6" class="px-4 py-6 text-center text-sm text-gray-500">Memuat...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <div id="teacher-modal" class="hidden fixed inset-0 z-50 bg-gray-900 bg-opacity-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-lg w-full max-w-2xl max-h-[90vh] overflow-y-auto">
      <div class="px-5 py-4 border-b border-gray-200 flex justify-between items-center">
        <h3 id="modal-title" class="text-base font-semibold">Tambah Guru</h3>
        <button onclick="closeTeacherModal()" class="text-gray-400 hover:text-gray-600">&times;</button>
      </div>
      <form id="teacher-form" class="p-5 grid sm:grid-cols-2 gap-3">
        <input type="hidden" id="teacher-id">
        <div><label class="block text-sm font-medium text-gray-700 mb-1">NIP</label><input id="form-nip" type="text" class="w-full px-3 py-2 border border-gray-300 rounded-md text-sm"></div>
        <div><label class="block text-sm font-medium text-gray-700 mb-1">Nama Lengkap *</label><input id="form-name" type="text" required class="w-full px-3 py-2 border border-gray-300 rounded-md text-sm"></div>
        <div><label class="block text-sm font-medium text-gray-700 mb-1">Email (Opsional)</label><input id="form-email" type="email" placeholder="nama@email.com (opsional)" class="w-full px-3 py-2 border border-gray-300 rounded-md text-sm"></div>
        <div><label class="block text-sm font-medium text-gray-700 mb-1">No HP</label><input id="form-phone" type="tel" class="w-full px-3 py-2 border border-gray-300 rounded-md text-sm"></div>
        <div><label class="block text-sm font-medium text-gray-700 mb-1">Spesialisasi</label><input id="form-specialization" type="text" class="w-full px-3 py-2 border border-gray-300 rounded-md text-sm" placeholder="Mis. Pendidikan PAUD"></div>
        <div><label class="block text-sm font-medium text-gray-700 mb-1">Tanggal Mulai</label><input id="form-start" type="date" class="w-full px-3 py-2 border border-gray-300 rounded-md text-sm"></div>
        <div class="sm:col-span-2 flex items-center gap-2 pt-2"><input id="form-active" type="checkbox" checked class="rounded"><label for="form-active" class="text-sm text-gray-700">Aktif mengajar</label></div>
        <div class="sm:col-span-2 flex justify-end gap-2 pt-3 border-t border-gray-200">
          <button type="button" onclick="closeTeacherModal()" class="px-4 py-2 border border-gray-300 text-gray-700 text-sm rounded-md hover:bg-gray-50">Batal</button>
          <button type="submit" class="px-4 py-2 bg-primary-600 text-white text-sm rounded-md hover:bg-primary-700">Simpan</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../../shared/js/supabase-config.js"></script>
  <script src="../../shared/js/auth.js"></script>
  <script src="../../shared/js/api.js"></script>
  <script src="../../shared/js/shell.js"></script>
  <script>
    requireAuth('super_admin,admin_tu');

    const MENU = Shell.ADMIN_MENU;

    Shell.init({
      menu: MENU,
      active: 'teachers.html',
      portalLabel: 'Portal Admin',
      title: 'Manajemen Guru',
      subtitle: 'Tenaga pendidik yayasan',
      showRefresh: true,
      onRefresh: loadTeachers
    });

    let teachersCache = [];

    async function loadTeachers() {
      Shell.hideError();
      const stopSpin = Shell.startRefresh();
      const search = document.getElementById('filter-search').value;
      const active = document.getElementById('filter-active').value;
      const params = { per_page: 100 };
      if (search) params.search = search;
      if (active !== '') params.is_active = active;

      const tbody = document.getElementById('teachers-tbody');
      tbody.innerHTML = Shell.skeletonRows(6, 4);

      try {
        const res = await apiCall('teachers', 'list', params);
        if (!res.success) {
          Shell.showError(res.message || 'Gagal memuat data guru');
          tbody.innerHTML = `<tr><td colspan="6" class="px-4 py-6 text-center text-sm text-red-600">${res.message || 'Gagal'}</td></tr>`;
          return;
        }
        const items = Array.isArray(res.data) ? res.data : ((res.data && (res.data.items || res.data.teachers)) || []);
        teachersCache = items;
        const badge = document.getElementById('teacher-count-badge');
        if (badge) badge.textContent = items.length + ' Tenaga Pendidik';
        if (items.length === 0) {
          tbody.innerHTML = '<tr><td colspan="6" class="px-4 py-6 text-center text-sm text-gray-500">Tidak ada data</td></tr>';
          return;
        }
        tbody.innerHTML = items.map(t => `
          <tr>
            <td class="px-4 py-3 text-sm font-mono tabular-nums text-gray-700 whitespace-nowrap">${t.nip || '-'}</td>
            <td class="px-4 py-3 text-sm font-medium text-gray-900 min-w-0"><span class="truncate block max-w-xs">${t.full_name}</span></td>
            <td class="px-4 py-3 text-sm text-gray-600 truncate">${t.email || '-'}</td>
            <td class="px-4 py-3 text-sm text-gray-600 truncate">${t.specialization || '-'}</td>
            <td class="px-4 py-3"><span class="px-2 py-0.5 text-xs rounded font-medium ${t.is_active ? 'bg-primary-100 text-primary-700' : 'bg-gray-100 text-gray-700'}">${t.is_active ? 'Aktif' : 'Nonaktif'}</span></td>
            <td class="px-4 py-3 text-sm whitespace-nowrap">
              <button onclick="editTeacher('${t.id}')" class="text-primary-700 hover:text-primary-900 mr-3 font-medium">Edit</button>
              <button onclick="toggleTeacher('${t.id}', ${!t.is_active})" class="${t.is_active ? 'text-amber-700 hover:text-amber-900' : 'text-primary-700 hover:text-primary-900'} font-medium mr-3">${t.is_active ? 'Nonaktifkan' : 'Aktifkan'}</button>
              <button onclick="deleteTeacher('${t.id}')" class="text-red-700 hover:text-red-900 font-medium">Hapus</button>
            </td>
          </tr>`).join('');
      } catch (e) {
        Shell.showError('Tidak dapat terhubung ke server.');
      } finally {
        stopSpin();
      }
    }

    function openTeacherModal(teacher = null) {
      document.getElementById('teacher-modal').classList.remove('hidden');
      document.getElementById('teacher-form').reset();
      document.getElementById('teacher-id').value = '';
      if (teacher) {
        document.getElementById('modal-title').textContent = 'Edit Guru';
        document.getElementById('teacher-id').value = teacher.id;
        document.getElementById('form-nip').value = teacher.nip || '';
        document.getElementById('form-name').value = teacher.full_name || '';
        document.getElementById('form-email').value = teacher.email || '';
        document.getElementById('form-phone').value = teacher.phone || '';
        document.getElementById('form-specialization').value = teacher.specialization || '';
        document.getElementById('form-start').value = teacher.start_date || '';
        document.getElementById('form-active').checked = !!teacher.is_active;
      } else {
        document.getElementById('modal-title').textContent = 'Tambah Guru';
      }
    }
    function closeTeacherModal() { document.getElementById('teacher-modal').classList.add('hidden'); }

    async function editTeacher(id) {
      const res = await apiCall('teachers', 'get', { id });
      if (res.success) openTeacherModal(res.data);
      else showToast(res.message, 'error');
    }

    async function toggleTeacher(id, activate) {
      const res = await apiCall('teachers', activate ? 'activate' : 'deactivate', { id });
      showToast(res.message, res.success ? 'success' : 'error');
      if (res.success) loadTeachers();
    }

    async function deleteTeacher(id) {
      if (!confirm('Hapus data guru ini? Tindakan ini tidak dapat dibatalkan.')) return;
      const res = await apiCall('teachers', 'delete', { id });
      showToast(res.message || (res.success ? 'Data guru berhasil dihapus' : 'Gagal menghapus guru'), res.success ? 'success' : 'error');
      if (res.success) loadTeachers();
    }

    document.getElementById('teacher-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const id = document.getElementById('teacher-id').value;
      const data = {
        nip: document.getElementById('form-nip').value,
        full_name: document.getElementById('form-name').value,
        email: document.getElementById('form-email').value,
        phone: document.getElementById('form-phone').value,
        specialization: document.getElementById('form-specialization').value,
        start_date: document.getElementById('form-start').value,
        is_active: document.getElementById('form-active').checked
      };

      const res = await apiCall('teachers', id ? 'update' : 'create', id ? { id, ...data } : data);
      showToast(res.message, res.success ? 'success' : 'error');
      if (res.success) { closeTeacherModal(); loadTeachers(); }
    });

    function printTeachersReport() {
      if (teachersCache.length === 0) {
        showToast('Tidak ada data guru untuk dicetak.', 'warning');
        return;
      }

      const activeFilter = document.getElementById('filter-active').value;
      const statusText = activeFilter === 'true' ? 'Aktif Mengajar Saja' : (activeFilter === 'false' ? 'Nonaktif Saja' : 'Semua Status');
      const today = new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });
      const activeCount = teachersCache.filter(t => t.is_active).length;
      const inactiveCount = teachersCache.filter(t => !t.is_active).length;

      const printWindow = window.open('', '_blank', 'width=900,height=900');
      if (!printWindow) {
        alert('Mohon izinkan pop-up peramban untuk mencetak rekap data guru.');
        return;
      }

      const rowsHtml = teachersCache.map((t, idx) => `
        <tr>
          <td style="padding: 6px 8px; border-bottom: 1px solid #e2e8f0; font-family: monospace; text-align: center;">${idx + 1}</td>
          <td style="padding: 6px 8px; border-bottom: 1px solid #e2e8f0; font-family: monospace;">${t.nip || '-'}</td>
          <td style="padding: 6px 8px; border-bottom: 1px solid #e2e8f0; font-weight: bold;">${t.full_name || '-'}</td>
          <td style="padding: 6px 8px; border-bottom: 1px solid #e2e8f0;">${t.email || '-'}</td>
          <td style="padding: 6px 8px; border-bottom: 1px solid #e2e8f0; font-family: monospace; font-size: 11px;">${t.phone || '-'}</td>
          <td style="padding: 6px 8px; border-bottom: 1px solid #e2e8f0;">${t.specialization || '-'}</td>
          <td style="padding: 6px 8px; border-bottom: 1px solid #e2e8f0; text-align: center;">${t.start_date || '-'}</td>
          <td style="padding: 6px 8px; border-bottom: 1px solid #e2e8f0; text-align: center;">
            <span style="display: inline-block; padding: 2px 8px; border-radius: 9999px; font-size: 10px; font-weight: bold; background: ${t.is_active ? '#e0f2fe' : '#f1f5f9'}; color: ${t.is_active ? '#0369a1' : '#475569'};">
              ${t.is_active ? 'Aktif' : 'Nonaktif'}
            </span>
          </td>
        </tr>
      `).join('');

      printWindow.document.write(`
        <!DOCTYPE html>
        <html lang="id">
        <head>
          <meta charset="UTF-8">
          <title>Laporan Data Tenaga Pendidik - Yayasan At Tarbiyyah Wijaya Kusuma</title>
          <style>
            body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 32px; color: #0f172a; line-height: 1.4; font-size: 11px; }
            .kop { text-align: center; border-bottom: 3px double #0284c7; padding-bottom: 10px; margin-bottom: 20px; }
            .kop h1 { margin: 0; color: #0369a1; font-size: 18px; font-weight: 800; }
            .kop p { margin: 2px 0 0; font-size: 11px; color: #64748b; }
            .title { text-align: center; margin-bottom: 16px; }
            .title h2 { margin: 0; font-size: 15px; font-weight: 800; text-transform: uppercase; color: #1e293b; }
            .meta-box { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 8px 14px; margin-bottom: 16px; font-size: 11px; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
            table { width: 100%; border-collapse: collapse; margin-bottom: 24px; font-size: 11px; }
            th { background: #f1f5f9; padding: 8px; text-align: left; font-weight: 700; color: #475569; border-bottom: 2px solid #cbd5e1; }
            .ttd-wrap { display: flex; justify-content: space-between; margin-top: 36px; font-size: 11px; }
            .ttd { text-align: center; width: 220px; }
            @media print { .no-print { display: none !important; } }
          </style>
        </head>
        <body>
          <div class="kop">
            <h1>YAYASAN AT TARBIYYAH WIJAYA KUSUMA SAMARINDA</h1>
            <p>TPQ Ulinnuha (TPQ Pagi &amp; Tahfidz) &bull; KB Ulinnuha (PAUD)</p>
            <p>Jl. Wijaya Kusuma V-A No. 38, Samarinda Ulu | Telp/WA: 0813-4714-2829</p>
          </div>
          <div class="title">
            <h2>Laporan Rekapitulasi Guru &amp; Tenaga Kependidikan</h2>
            <p style="margin: 3px 0 0; color: #64748b;">Per Tanggal: ${today}</p>
          </div>
          <div class="meta-box">
            <div><strong>Filter Status:</strong> ${statusText}</div>
            <div><strong>Total Pendidik:</strong> ${teachersCache.length} Orang</div>
            <div><strong>Komposisi:</strong> ${activeCount} Aktif Mengajar &bull; ${inactiveCount} Nonaktif</div>
          </div>
          <table>
            <thead>
              <tr>
                <th style="width: 35px; text-align: center;">No</th>
                <th>NIP</th>
                <th>Nama Lengkap</th>
                <th>Email</th>
                <th>No. HP</th>
                <th>Spesialisasi / Bidang</th>
                <th style="text-align: center;">Tgl Bergabung</th>
                <th style="text-align: center;">Status</th>
              </tr>
            </thead>
            <tbody>${rowsHtml}</tbody>
          </table>
          <div class="ttd-wrap">
            <div class="ttd">
              <p>Mengetahui,<br>Ketua Yayasan,</p>
              <br><br><br>
              <p><strong>( Makhrus )</strong></p>
            </div>
            <div class="ttd">
              <p>Samarinda, ${today}<br>Bagian Administrasi &amp; TU,</p>
              <br><br><br>
              <p><strong>( Sri Pragawati )</strong></p>
            </div>
          </div>
          <div class="no-print" style="text-align: center; margin-top: 30px;">
            <button onclick="window.print()" style="padding: 10px 24px; background: #0284c7; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer;">Cetak Rekap Guru Ini</button>
          </div>
          <script>window.onload = function() { window.print(); };<\/script>
        </body>
        </html>
      `);
      printWindow.document.close();
    }

    function exportTeachersToExcel() {
      if (teachersCache.length === 0) {
        showToast('Tidak ada data guru untuk diekspor.', 'warning');
        return;
      }

      const headers = ['No', 'NIP', 'Nama Lengkap', 'Email', 'No Telepon / HP', 'Spesialisasi / Bidang', 'Tanggal Mulai', 'Status Keaktifan'];
      const rows = [headers];

      teachersCache.forEach((t, idx) => {
        rows.push([
          idx + 1,
          `"${t.nip || '-'}"`,
          `"${(t.full_name || '-').replace(/"/g, '""')}"`,
          `"${(t.email || '-').replace(/"/g, '""')}"`,
          `"${t.phone || '-'}"`,
          `"${(t.specialization || '-').replace(/"/g, '""')}"`,
          `"${t.start_date || '-'}"`,
          `"${t.is_active ? 'Aktif' : 'Nonaktif'}"`
        ]);
      });

      const activeCount = teachersCache.filter(t => t.is_active).length;
      const inactiveCount = teachersCache.filter(t => !t.is_active).length;
      rows.push([]);
      rows.push(['', '', 'TOTAL TENAGA PENDIDIK', teachersCache.length, '', '', 'KOMPOSISI AKTIF', `${activeCount} Aktif, ${inactiveCount} Nonaktif`]);

      const csvContent = '\uFEFF' + rows.map(r => r.join(',')).join('\r\n');
      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `Data_Guru_Yayasan_${new Date().toISOString().slice(0, 10)}.csv`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast('File Excel Data Guru berhasil diunduh.', 'success');
    }

    loadTeachers();
  </script>
</body>
</html>
