<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Pengumuman dan edaran resmi dari Yayasan At Tarbiyyah Wijaya Kusuma Samarinda untuk santri, siswa, dan orang tua wali.">
  <title>Pengumuman Resmi - Yayasan At Tarbiyyah Wijaya Kusuma Samarinda</title>

  <!-- Tailwind via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Flaticon Uicons -->
  <link rel="stylesheet" href="https://cdn-uicons.flaticon.com/2.6.0/uicons-regular-rounded/css/uicons-regular-rounded.css">
  <link rel="stylesheet" href="https://cdn-uicons.flaticon.com/2.6.0/uicons-solid-rounded/css/uicons-solid-rounded.css">
  <link rel="stylesheet" href="https://cdn-uicons.flaticon.com/2.6.0/uicons-bold-rounded/css/uicons-bold-rounded.css">
  <link rel="stylesheet" href="https://cdn-uicons.flaticon.com/2.6.0/uicons-brands/css/uicons-brands.css">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
          colors: {
            primary: {
              50:  '#F0F9FF',
              100: '#E0F2FE',
              200: '#BAE6FD',
              300: '#7DD3FC',
              400: '#38BDF8',
              500: '#0EA5E9',
              600: '#0284C7',
              700: '#0369A1',
              800: '#075985',
              900: '#0C4A6E',
              950: '#082F49'
            }
          }
        }
      }
    };
  </script>

  <link rel="stylesheet" href="css/style.css">
  <script src="/shared/js/page-transitions.js" onerror="this.onerror=null;this.src='../shared/js/page-transitions.js'"></script>
</head>
<body class="font-sans bg-slate-50 text-slate-800 antialiased selection:bg-primary-500 selection:text-white">

  <!-- Header Placeholder (Zero-Layout Shift pinned) -->
  <div id="site-header"></div>

  <!-- Hero Header Section -->
  <section class="bg-gradient-to-br from-primary-800 via-primary-900 to-slate-950 text-white py-14 sm:py-20 relative overflow-hidden">
    <div class="absolute inset-0 bg-[radial-gradient(circle_at_top_right,rgba(14,165,233,0.15),transparent_50%)]"></div>
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 relative z-10 text-center">
      <h1 class="text-3xl sm:text-5xl font-extrabold tracking-tight text-white mb-4 text-balance">
        Pengumuman &amp; Edaran
      </h1>
      <p class="text-base sm:text-lg text-primary-100 max-w-2xl mx-auto leading-relaxed text-pretty">
        Surat edaran resmi, jadwal kegiatan, dan informasi penting bagi seluruh keluarga besar Yayasan Samarinda.
      </p>
    </div>
  </section>

  <!-- Main Content -->
  <main class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-12 sm:py-16">
    <div id="ann-list" class="space-y-4">
      <div class="bg-white border border-slate-200 rounded-2xl p-6 text-center text-slate-400 text-xs animate-pulse">
        Memuat pengumuman resmi...
      </div>
    </div>
  </main>

  <!-- Site Footer Placeholder -->
  <div id="site-footer"></div>

  <!-- Scripts -->
  <script src="/shared/js/supabase-config.js" onerror="this.onerror=null;this.src='../shared/js/supabase-config.js'"></script>
  <script src="/shared/js/api.js" onerror="this.onerror=null;this.src='../shared/js/api.js'"></script>
  <script src="js/public-shell.js"></script>
  <script src="js/app.js"></script>
  <script>
    injectSiteChrome({ activeKey: 'announcements', basePath: './' });

    function formatDateIndo(dateStr) {
      if (!dateStr) return '';
      try {
        const d = new Date(dateStr);
        return d.toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });
      } catch (_) {
        return dateStr;
      }
    }

    async function loadAnnouncements() {
      const list = document.getElementById('ann-list');
      let items = [];
      try {
        if (typeof apiCall === 'function') {
          const res = await apiCall('announcements', 'list', { per_page: 30 });
          if (res && res.success) {
            items = Array.isArray(res.data) ? res.data : ((res.data && res.data.items) || res.items || []);
          }
        }
      } catch (err) {
        console.warn('API announcements:', err);
      }

      if (!items || items.length === 0) {
        items = [
          {
            id: '1',
            title: 'Edaran Jadwal Libur Awal Ramadhan dan Pembelajaran Mandiri Santri 1447 H',
            category: 'Penting',
            created_at: new Date().toISOString(),
            content: 'Diberitahukan kepada seluruh bapak/ibu wali santri PAUD, TK, dan TPQ bahwa kegiatan belajar mengajar tatap muka diliburkan pada 1-3 Ramadhan untuk memberikan kesempatan persiapan ibadah keluarga.'
          },
          {
            id: '2',
            title: 'Pembukaan Gelombang II Penerimaan Peserta Didik Baru (PPDB) 2026/2027',
            category: 'PPDB',
            created_at: new Date(Date.now() - 86400000 * 4).toISOString(),
            content: 'Pendaftaran PPDB Gelombang II resmi dibuka mulai tanggal 15 bulan ini hingga kuota terpenuhi. Dapatkan penawaran bebas biaya formulir bagi calon pendaftar berprestasi.'
          }
        ];
      }

      list.innerHTML = items.map(a => {
        const dateFormatted = formatDateIndo(a.published_at || a.created_at);
        const category = a.category || 'Edaran';
        return `
          <article class="bg-white border border-slate-200/90 rounded-2xl p-5 sm:p-6 shadow-sm hover:shadow-md transition">
            <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
              <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-md text-xs font-bold bg-primary-50 text-primary-800 border border-primary-200/60">
                <i class="fi fi-rr-megaphone text-xs text-primary-600"></i>
                <span>${category}</span>
              </span>
              <div class="flex items-center gap-1.5 text-xs text-slate-400">
                <i class="fi fi-rr-calendar text-xs text-primary-600"></i>
                <time class="tabular-nums font-medium">${dateFormatted}</time>
              </div>
            </div>
            <h3 class="text-base sm:text-lg font-bold text-slate-900 mb-2 leading-snug text-balance">
              ${a.title}
            </h3>
            <p class="text-xs sm:text-sm text-slate-600 leading-relaxed text-pretty">
              ${a.content || a.summary || ''}
            </p>
          </article>
        `;
      }).join('');
    }

    loadAnnouncements();
  </script>
</body>
</html>
