<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cek Status Pendaftaran PPDB — Yayasan At Tarbiyyah Wijaya Kusuma</title>
  <link rel="icon" type="image/svg+xml" href="../../shared/img/logo.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../../shared/css/globals.css" />
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 text-slate-900 font-sans antialiased min-h-screen flex flex-col">

  <!-- HEADER -->
  <header class="sticky top-0 z-50 border-b border-slate-200/80 bg-white/95 backdrop-blur-md">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
      <a href="../index.html" class="flex items-center gap-3.5">
        <div class="w-11 h-11 rounded-xl bg-white border border-slate-200 p-1 shadow-sm flex items-center justify-center">
          <img src="../../shared/img/logo.svg" alt="Logo" class="w-full h-full object-contain" />
        </div>
        <div>
          <span class="block font-display font-extrabold text-sm sm:text-base text-slate-900 leading-tight">AT TARBIYYAH</span>
          <span class="block text-[11px] font-medium text-slate-500">TPQ &bull; Tahfidz &bull; PAUD &bull; PKBM Samarinda</span>
        </div>
      </a>
      <div class="flex items-center gap-3">
        <a href="../ppdb.html" class="px-4 py-2 rounded-xl text-xs font-bold text-slate-600 hover:bg-slate-100 border border-slate-200 transition-colors flex items-center gap-1.5">
          <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i> Formulir PPDB
        </a>
        <a href="../login.html" class="px-4 py-2.5 rounded-xl text-xs font-bold text-white bg-sky-600 hover:bg-sky-700 transition-colors">
          Login Portal
        </a>
      </div>
    </div>
  </header>

  <main class="flex-1 py-8 sm:py-12 px-3 sm:px-6 lg:px-8">
    <div class="max-w-3xl mx-auto">

      <!-- SEARCH BOX -->
      <div class="bg-white rounded-2xl sm:rounded-3xl border border-slate-200/80 shadow-xl shadow-slate-200/40 p-4 sm:p-8 mb-6 sm:mb-8">
        <div class="flex items-center gap-3 mb-4">
          <div class="w-10 h-10 sm:w-11 sm:h-11 rounded-2xl bg-sky-50 border border-sky-100 text-sky-600 flex items-center justify-center shrink-0">
            <i data-lucide="file-search" class="w-5 h-5"></i>
          </div>
          <div>
            <h1 class="font-display text-lg sm:text-2xl font-extrabold text-slate-900 leading-tight">Cek Status &amp; Lembar Data PPDB</h1>
            <p class="text-xs text-slate-500 mt-0.5">Masukkan Nomor Registrasi Anda untuk melihat lembar hasil pendaftaran, status penerimaan, Nomor Induk / NIS Lokal, dan Sandi Portal Siswa</p>
          </div>
        </div>

        <form onsubmit="handleCheckStatus(event)" class="mt-5 flex flex-col sm:flex-row gap-2.5 sm:gap-3">
          <div class="relative flex-1">
            <i data-lucide="hash" class="w-4 h-4 text-slate-400 absolute left-4 top-1/2 -translate-y-1/2"></i>
            <input type="text" id="reg-input" required placeholder="Contoh: REG-2026-001"
              class="w-full pl-11 pr-4 py-3 sm:py-3.5 rounded-xl border border-slate-300 text-sm font-mono font-bold uppercase focus:outline-none focus:ring-2 focus:ring-sky-500/20 focus:border-sky-600" />
          </div>
          <button type="submit" id="btn-search" class="w-full sm:w-auto px-6 py-3 sm:py-3.5 rounded-xl bg-sky-600 hover:bg-sky-700 active:scale-[0.98] text-white font-bold text-sm shadow-md shadow-sky-600/20 transition-all flex items-center justify-center gap-2 cursor-pointer shrink-0">
            <i data-lucide="search" class="w-4 h-4"></i> Cek Status
          </button>
        </form>

        <!-- Quick Demo Pills -->
        <div class="mt-4 flex flex-wrap items-center gap-1.5 sm:gap-2 text-xs text-slate-500">
          <span class="text-[11px] sm:text-xs">Contoh Nomor:</span>
          <button type="button" onclick="fillAndSearch('REG-2026-001')" class="px-2.5 py-1 rounded-lg bg-slate-100 hover:bg-sky-50 hover:text-sky-700 font-mono font-semibold text-xs transition-colors">REG-2026-001</button>
          <button type="button" onclick="fillAndSearch('REG-2026-002')" class="px-2.5 py-1 rounded-lg bg-slate-100 hover:bg-sky-50 hover:text-sky-700 font-mono font-semibold text-xs transition-colors">REG-2026-002</button>
          <button type="button" onclick="fillAndSearch('REG-2026-003')" class="px-2.5 py-1 rounded-lg bg-slate-100 hover:bg-sky-50 hover:text-sky-700 font-mono font-semibold text-xs transition-colors">REG-2026-003</button>
        </div>
      </div>

      <!-- RESULT CONTAINER -->
      <div id="result-container" class="hidden"></div>

    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../../shared/js/config.js"></script>
  <script src="../../shared/js/auth.js"></script>
  <script src="../../shared/js/api.js"></script>
  <script>
    lucide.createIcons();

    let currentRegistrationRecord = null;

    document.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const reg = params.get('reg');
      if (reg) {
        fillAndSearch(reg);
      }
    });

    function fillAndSearch(regNo) {
      document.getElementById('reg-input').value = regNo;
      lookupRegistration(regNo);
    }

    function handleCheckStatus(e) {
      e.preventDefault();
      const val = document.getElementById('reg-input').value.trim().toUpperCase();
      if (val) lookupRegistration(val);
    }

    function parseRegistrationMeta(r) {
      let metaObj = {};
      if (r.form_metadata && typeof r.form_metadata === 'object') {
        metaObj = { ...r.form_metadata };
      }
      if (r.notes) {
        try {
          const parsed = typeof r.notes === 'string' && r.notes.trim().startsWith('{') ? JSON.parse(r.notes) : {};
          metaObj = { ...parsed, ...metaObj };
        } catch (_) {}
      }
      return metaObj;
    }

    async function lookupRegistration(regNo) {
      const container = document.getElementById('result-container');
      container.classList.remove('hidden');
      container.innerHTML = `
        <div class="bg-white rounded-3xl border border-slate-200 p-10 text-center text-slate-500 text-sm">
          Mencari data pendaftaran <strong>${regNo}</strong>...
        </div>`;

      const res = await apiCall('ppdb', 'check_status', { registration_number: regNo });
      if (!res.success || !res.data) {
        container.innerHTML = `
          <div class="bg-white rounded-3xl border border-rose-200 p-8 text-center">
            <div class="w-12 h-12 rounded-2xl bg-rose-50 text-rose-600 flex items-center justify-center mx-auto mb-3">
              <i data-lucide="alert-circle" class="w-6 h-6"></i>
            </div>
            <h3 class="font-display font-bold text-slate-900 mb-1">Data Tidak Ditemukan</h3>
            <p class="text-xs text-slate-500 max-w-md mx-auto">${res.error || 'Nomor registrasi tidak ditemukan. Pastikan format nomor sudah benar (contoh: REG-2026-001).'}</p>
          </div>`;
        lucide.createIcons();
        return;
      }

      const r = res.data;
      currentRegistrationRecord = r;
      const metaObj = parseRegistrationMeta(r);
      const isPaud = r.level === 'KB Ulinnuha (PAUD)' || metaObj.form_type === 'paud';
      const photoUrl = r.photo_url || metaObj.photo_url || '';
      const academicYear = metaObj.academic_year || '2026/2027';
      const assignedNis = r.converted_nis || metaObj.converted_nis || '';
      const assignedClass = r.class_name || metaObj.class_name || '';
      const assignedEntryDate = metaObj.entry_date || r.entry_date || '';
      const assignedPassword = metaObj.portal_password || r.portal_password || '';

      const statusConfig = {
        pending: {
          badge: 'bg-amber-50 text-amber-700 border-amber-200',
          icon: 'clock',
          label: 'Menunggu Verifikasi Admin TU',
          desc: 'Formulir pendaftaran & berkas Anda telah masuk ke sistem. Admin Yayasan sedang memvalidasi data untuk menerbitkan Nomor Induk / NIS Lokal, Kelompok/Kelas, dan Sandi Portal Siswa.'
        },
        accepted: {
          badge: 'bg-emerald-50 text-emerald-700 border-emerald-200',
          icon: 'check-circle-2',
          label: 'Diterima / Lulus Verifikasi',
          desc: 'Selamat! Pendaftaran santri/anak didik telah disetujui oleh Admin Yayasan.'
        },
        converted: {
          badge: 'bg-sky-50 text-sky-700 border-sky-200',
          icon: 'award',
          label: 'Resmi Terdaftar & Aktif di Portal Siswa',
          desc: 'Selamat! Pendaftaran telah divalidasi oleh Admin Yayasan. Nomor Induk / NIS Lokal, Kelompok/Kelas, dan Sandi Login Portal Siswa telah diterbitkan di bawah ini.'
        },
        rejected: {
          badge: 'bg-rose-50 text-rose-700 border-rose-200',
          icon: 'x-circle',
          label: 'Belum Dapat Diterima / Perlu Perbaikan',
          desc: 'Mohon hubungi sekretariat yayasan untuk informasi lebih lanjut terkait berkas pendaftaran.'
        }
      };

      const st = statusConfig[r.status] || statusConfig.pending;

      const fatherName = metaObj.father_name || r.parent_name || '-';
      const fatherJob = metaObj.father_job || r.parent_occupation || '-';
      const fatherEdu = metaObj.father_education || '-';
      const fatherRelation = metaObj.father_relation || 'Ayah Kandung';
      const fatherPhoneDisp = metaObj.father_phone_home || r.parent_phone || '-';
      const fatherTtl = metaObj.father_ttl || '-';
      const fatherRel = metaObj.father_religion || 'Islam';

      const motherName = metaObj.mother_name || '-';
      const motherJob = metaObj.mother_job || '-';
      const motherEdu = metaObj.mother_education || '-';
      const motherRelation = metaObj.mother_relation || 'Ibu Kandung';
      const motherPhoneDisp = metaObj.mother_phone_home || '-';
      const motherTtl = metaObj.mother_ttl || '-';
      const motherRel = metaObj.mother_religion || 'Islam';

      const hasMutasi = Boolean(metaObj.mutasi_date || metaObj.mutasi_origin || (metaObj.mutasi_group && metaObj.mutasi_group !== '-'));
      const hasOtherInfo = Boolean(metaObj.distance_km || metaObj.transport_mode);

      // Clean sibling text
      let siblingStr = '-';
      if (metaObj.siblings_count !== undefined && metaObj.siblings_count !== null && metaObj.siblings_count !== '') {
        const kandung = metaObj.siblings_count || '0';
        const tiri = metaObj.siblings_step || '0';
        const angkat = metaObj.siblings_adopted || '0';
        if (tiri !== '0' || angkat !== '0') {
          siblingStr = `${kandung} Orang (Kandung: ${kandung}, Tiri: ${tiri}, Angkat: ${angkat})`;
        } else {
          siblingStr = `${kandung} Orang (Kandung)`;
        }
      }

      let officialAccountBox = '';
      if (r.status === 'converted' || r.status === 'accepted') {
        officialAccountBox = `
          <div class="p-4 sm:p-6 rounded-2xl bg-gradient-to-br from-emerald-600 to-teal-700 text-white shadow-lg mb-6">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
              <div>
                <span class="inline-block px-2.5 py-0.5 rounded-full bg-white/20 text-[10px] font-bold uppercase tracking-wider mb-1">Diterbitkan Oleh Admin Sekolah</span>
                <p class="text-xs font-bold uppercase tracking-wider text-emerald-100">${isPaud ? 'Nomor Induk Siswa (PAUD)' : 'NIS Lokal Santri (TPQ)'}</p>
                <p class="font-mono text-2xl sm:text-3xl font-extrabold tracking-tight mt-0.5">${assignedNis || 'Sedang Diterbitkan'}</p>
                <p class="text-xs text-emerald-100 mt-1">${isPaud ? 'Kelompok' : 'Kelas / Jenjang'}: <strong>${assignedClass || r.level || '-'}</strong> ${assignedEntryDate ? '&bull; Tgl Masuk: <strong>' + assignedEntryDate + '</strong>' : ''}</p>
              </div>
              <div class="flex flex-col sm:flex-row gap-2 w-full sm:w-auto">
                <button type="button" onclick="printOfficialLetter()"
                  class="w-full sm:w-auto px-4 py-2.5 rounded-xl bg-white/15 hover:bg-white/25 border border-white/30 text-white font-bold text-xs transition-colors flex items-center justify-center gap-1.5 cursor-pointer">
                  <i data-lucide="printer" class="w-4 h-4"></i> Cetak Lembar Resmi
                </button>
                <a href="../login.html" class="w-full sm:w-auto px-5 py-2.5 rounded-xl bg-white text-emerald-900 font-bold text-xs hover:bg-emerald-50 transition-colors flex items-center justify-center gap-1.5 shadow-sm">
                  <i data-lucide="log-in" class="w-4 h-4"></i> Login Portal Siswa
                </a>
              </div>
            </div>
            <div class="mt-4 pt-3 border-t border-white/15 grid sm:grid-cols-2 gap-3 text-xs text-emerald-50">
              <div class="p-3 rounded-xl bg-white/10 border border-white/15">
                <span class="block text-[10px] uppercase tracking-wider text-emerald-200 font-bold">Username Login Portal Siswa</span>
                <span class="font-mono font-extrabold text-sm text-white select-all">${assignedNis || '-'}</span>
              </div>
              <div class="p-3 rounded-xl bg-white/10 border border-white/15">
                <span class="block text-[10px] uppercase tracking-wider text-emerald-200 font-bold">Sandi / Password Portal Siswa (Dari Admin)</span>
                <span class="font-mono font-extrabold text-sm text-amber-200 select-all">${assignedPassword || 'Hubungi Admin TU / Gunakan Tgl Lahir (DDMMYYYY)'}</span>
              </div>
            </div>
          </div>`;
      } else {
        officialAccountBox = `
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 p-4 rounded-2xl bg-amber-50/70 border border-amber-200/80 mb-6">
            <div class="text-xs text-amber-900">
              <p class="font-bold">Menunggu Penerbitan Nomor Induk / NIS &amp; Sandi Portal oleh Admin</p>
              <p class="text-amber-700 mt-0.5 leading-relaxed">Setelah Admin Sekolah memvalidasi pendaftaran Anda, Nomor Induk / NIS Lokal, Kelompok/Kelas, dan Sandi Login Portal Siswa akan tampil di halaman ini.</p>
            </div>
            <button type="button" onclick="printOfficialLetter()"
              class="w-full sm:w-auto shrink-0 px-4 py-2.5 rounded-xl bg-white hover:bg-slate-50 border border-slate-200 text-slate-700 font-bold text-xs transition-colors flex items-center justify-center gap-1.5 shadow-sm cursor-pointer">
              <i data-lucide="printer" class="w-4 h-4 text-sky-600"></i> Cetak Lembar Data PPDB
            </button>
          </div>`;
      }

      let formattedSheetHtml = '';
      if (isPaud) {
        formattedSheetHtml = `
          <div class="p-4 sm:p-6 rounded-2xl border border-slate-200 bg-white space-y-5">
            <!-- Header PAUD + Pasfoto -->
            <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 pb-4 border-b border-slate-200">
              <div class="min-w-0 flex-1">
                <span class="inline-block px-2.5 py-1 rounded-md bg-emerald-50 text-emerald-800 text-[10px] font-bold uppercase tracking-wider border border-emerald-200 mb-1.5">Buku Induk Anak Didik KB Ulinnuha (PAUD)</span>
                <h4 class="font-display font-extrabold text-lg sm:text-xl text-slate-900 leading-tight">${r.student_name || '-'}</h4>
                <p class="text-xs text-slate-500 mt-1">Tahun Pelajaran: <strong class="text-slate-800">${academicYear}</strong></p>
                ${(assignedNis || assignedClass) ? `
                <div class="flex flex-wrap gap-2 mt-2 text-[11px]">
                  ${assignedNis ? `<span class="px-2.5 py-1 rounded-lg bg-slate-100 text-slate-800 font-semibold border border-slate-200">No. Induk: <strong>${assignedNis}</strong></span>` : ''}
                  ${assignedClass ? `<span class="px-2.5 py-1 rounded-lg bg-slate-100 text-slate-800 font-semibold border border-slate-200">Kelompok: <strong>${assignedClass}</strong></span>` : ''}
                </div>` : ''}
              </div>
              <div class="shrink-0 flex flex-col items-center">
                ${photoUrl
                  ? `<img src="${photoUrl}" alt="Pasfoto Anak" class="w-24 h-32 object-cover rounded-xl border-2 border-slate-300 shadow-sm bg-slate-50" />`
                  : `<div class="w-24 h-32 rounded-xl border-2 border-dashed border-slate-300 flex items-center justify-center text-[10px] text-slate-400 text-center p-2 bg-slate-50">Pasfoto 3x4</div>`
                }
                <span class="text-[10px] font-bold text-slate-500 mt-1">Pasfoto Anak</span>
              </div>
            </div>

            <!-- A. Identitas Anak Didik -->
            <div>
              <div class="flex items-center gap-2 border-b-2 border-sky-600/25 pb-2 mb-3.5">
                <div class="w-2 h-4 bg-sky-600 rounded-sm"></div>
                <h5 class="text-xs font-bold uppercase tracking-wider text-slate-900">A. Identitas Anak Didik</h5>
              </div>

              <div class="grid grid-cols-1 sm:grid-cols-2 gap-x-8 gap-y-1 text-xs">
                <div class="py-2 border-b border-slate-100 flex items-start gap-1.5">
                  <span class="w-32 sm:w-36 shrink-0 text-slate-500 font-medium text-[11px]">1.a. Nama Lengkap</span>
                  <span class="text-slate-400 select-none text-[11px]">:</span>
                  <strong class="font-bold text-slate-900 flex-1 break-words">${r.student_name || '-'}</strong>
                </div>

                <div class="py-2 border-b border-slate-100 flex items-start gap-1.5">
                  <span class="w-32 sm:w-36 shrink-0 text-slate-500 font-medium text-[11px]">1.b. Nama Panggilan</span>
                  <span class="text-slate-400 select-none text-[11px]">:</span>
                  <span class="font-semibold text-slate-800 flex-1 break-words">${r.nickname || metaObj.nickname || '-'}</span>
                </div>

                <div class="py-2 border-b border-slate-100 flex items-start gap-1.5">
                  <span class="w-32 sm:w-36 shrink-0 text-slate-500 font-medium text-[11px]">2. Jenis Kelamin</span>
                  <span class="text-slate-400 select-none text-[11px]">:</span>
                  <span class="font-semibold text-slate-800 flex-1">${r.gender === 'P' ? 'Perempuan' : 'Laki-laki'}</span>
                </div>

                <div class="py-2 border-b border-slate-100 flex items-start gap-1.5">
                  <span class="w-32 sm:w-36 shrink-0 text-slate-500 font-medium text-[11px]">3. Tempat, Tgl Lahir</span>
                  <span class="text-slate-400 select-none text-[11px]">:</span>
                  <span class="font-semibold text-slate-800 flex-1">${r.birth_place || metaObj.birth_place || '-'}, ${r.birth_date || '-'}</span>
                </div>

                <div class="py-2 border-b border-slate-100 flex items-start gap-1.5">
                  <span class="w-32 sm:w-36 shrink-0 text-slate-500 font-medium text-[11px]">5. Agama</span>
                  <span class="text-slate-400 select-none text-[11px]">:</span>
                  <span class="font-semibold text-slate-800 flex-1">${metaObj.religion || 'Islam'}</span>
                </div>

                <div class="py-2 border-b border-slate-100 flex items-start gap-1.5">
                  <span class="w-32 sm:w-36 shrink-0 text-slate-500 font-medium text-[11px]">6. Kewarganegaraan</span>
                  <span class="text-slate-400 select-none text-[11px]">:</span>
                  <span class="font-semibold text-slate-800 flex-1">${metaObj.citizenship || 'Indonesia (WNI)'}</span>
                </div>

                <div class="py-2 border-b border-slate-100 flex items-start gap-1.5">
                  <span class="w-32 sm:w-36 shrink-0 text-slate-500 font-medium text-[11px]">7. Anak ke</span>
                  <span class="text-slate-400 select-none text-[11px]">:</span>
                  <span class="font-semibold text-slate-800 flex-1">${r.child_order || metaObj.child_order || '-'}</span>
                </div>

                <div class="py-2 border-b border-slate-100 flex items-start gap-1.5">
                  <span class="w-32 sm:w-36 shrink-0 text-slate-500 font-medium text-[11px]">8. Jumlah Saudara</span>
                  <span class="text-slate-400 select-none text-[11px]">:</span>
                  <span class="font-semibold text-slate-800 flex-1">${siblingStr}</span>
                </div>

                <div class="py-2 border-b border-slate-100 flex items-start gap-1.5">
                  <span class="w-32 sm:w-36 shrink-0 text-slate-500 font-medium text-[11px]">9. Status Anak</span>
                  <span class="text-slate-400 select-none text-[11px]">:</span>
                  <span class="font-semibold text-slate-800 flex-1">${metaObj.child_status || 'Anak Kandung'}</span>
                </div>

                <div class="py-2 border-b border-slate-100 flex items-start gap-1.5">
                  <span class="w-32 sm:w-36 shrink-0 text-slate-500 font-medium text-[11px]">10. Bahasa Sehari-hari</span>
                  <span class="text-slate-400 select-none text-[11px]">:</span>
                  <span class="font-semibold text-slate-800 flex-1">${metaObj.daily_language || '-'}</span>
                </div>

                <div class="sm:col-span-2 py-2 border-b border-slate-100 flex flex-col sm:flex-row sm:items-start gap-1 sm:gap-1.5">
                  <div class="flex items-center gap-1.5 w-32 sm:w-36 shrink-0">
                    <span class="text-slate-500 font-medium text-[11px]">4. Alamat Rumah</span>
                    <span class="text-slate-400 select-none text-[11px] hidden sm:inline">:</span>
                  </div>
                  <span class="font-semibold text-slate-800 flex-1 break-words leading-relaxed">${r.address || '-'}</span>
                </div>

                <div class="sm:col-span-2 py-2 border-b border-slate-100 flex items-start gap-1.5">
                  <span class="w-32 sm:w-36 shrink-0 text-slate-500 font-medium text-[11px]">11. Ciri-ciri Khusus</span>
                  <span class="text-slate-400 select-none text-[11px]">:</span>
                  <span class="font-semibold text-slate-800 flex-1 break-words">${metaObj.special_traits || '-'}</span>
                </div>
              </div>
            </div>

            <!-- B. Identifikasi Orang Tua / Wali -->
            <div>
              <div class="flex items-center gap-2 border-b-2 border-sky-600/25 pb-2 mb-3.5">
                <div class="w-2 h-4 bg-sky-600 rounded-sm"></div>
                <h5 class="text-xs font-bold uppercase tracking-wider text-slate-900">B. Identifikasi Orang Tua / Wali</h5>
              </div>

              <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <!-- Card Data Ayah -->
                <div class="bg-slate-50/80 border border-slate-200/90 rounded-2xl p-4 space-y-2.5">
                  <div class="flex items-center justify-between pb-2 border-b border-slate-200">
