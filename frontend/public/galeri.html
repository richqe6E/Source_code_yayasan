<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">

  <!-- Favicon / Brand Logo -->
  <link rel="icon" type="image/png" href="/images/logo.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png">
  <link rel="shortcut icon" type="image/x-icon" href="/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">

  <!-- Canonical & Social Meta -->
  <link rel="canonical" href="https://siyayasan.vercel.app/galeri.html">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Yayasan At Tarbiyyah Wijaya Kusuma Samarinda">
  <meta property="og:title" content="Galeri Foto Kegiatan - Yayasan At Tarbiyyah Wijaya Kusuma Samarinda">
  <meta property="og:description" content="Dokumentasi foto kegiatan belajar mengajar, pembiasaan ibadah, dan pentas seni santri PAUD, TK, dan TPQ At Tarbiyyah Samarinda.">
  <meta property="og:image" content="https://siyayasan.vercel.app/images/school-campus.jpg">
  <meta property="og:url" content="https://siyayasan.vercel.app/galeri.html">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Galeri Foto Kegiatan - Yayasan At Tarbiyyah Wijaya Kusuma Samarinda">
  <meta name="twitter:description" content="Dokumentasi foto kegiatan belajar mengajar, pembiasaan ibadah, dan pentas seni santri PAUD, TK, dan TPQ At Tarbiyyah Samarinda.">
  <meta name="twitter:image" content="https://siyayasan.vercel.app/images/school-campus.jpg">


  <!-- Tailwind via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Flaticon Uicons -->
  <link rel="stylesheet" href="https://cdn-uicons.flaticon.com/2.6.0/uicons-regular-rounded/css/uicons-regular-rounded.css">
  <link rel="stylesheet" href="https://cdn-uicons.flaticon.com/2.6.0/uicons-solid-rounded/css/uicons-solid-rounded.css">
  <link rel="stylesheet" href="https://cdn-uicons.flaticon.com/2.6.0/uicons-bold-rounded/css/uicons-bold-rounded.css">
  <link rel="stylesheet" href="https://cdn-uicons.flaticon.com/2.6.0/uicons-brands/css/uicons-brands.css">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
          colors: {
            primary: {
              50:  '#F0F9FF',
              100: '#E0F2FE',
              200: '#BAE6FD',
              300: '#7DD3FC',
              400: '#38BDF8',
              500: '#0EA5E9',
              600: '#0284C7',
              700: '#0369A1',
              800: '#075985',
              900: '#0C4A6E',
              950: '#082F49'
            }
          }
        }
      }
    };
  </script>

  <link rel="stylesheet" href="css/style.css">
  <script src="/shared/js/page-transitions.js" onerror="this.onerror=null;this.src='../shared/js/page-transitions.js'"></script>
</head>
<body class="font-sans bg-slate-50 text-slate-800 antialiased selection:bg-primary-500 selection:text-white">

  <!-- Header Placeholder (Zero-Layout Shift pinned) -->
  <div id="site-header"></div>

  <!-- Hero Header Section -->
  <section class="bg-gradient-to-br from-primary-800 via-primary-900 to-slate-950 text-white py-14 sm:py-20 relative overflow-hidden">
    <div class="absolute inset-0 bg-[radial-gradient(circle_at_top_right,rgba(14,165,233,0.15),transparent_50%)]"></div>
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 relative z-10 text-center">
      <h1 class="text-3xl sm:text-5xl font-extrabold tracking-tight text-white mb-4 text-balance blur-reveal">
        Galeri Foto &amp; Aktivitas
      </h1>
      <p class="text-base sm:text-lg text-primary-100 max-w-2xl mx-auto leading-relaxed text-pretty">
        Potret senyum ceria, kreativitas tanpa batas, dan kebersamaan santri di lingkungan sekolah Yayasan At Tarbiyyah Wijaya Kusuma Samarinda.
      </p>
    </div>
  </section>

  <!-- Main Content Grid -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12 sm:py-16 reveal">
    <div id="gallery-grid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-4 sm:gap-6">
      <div class="aspect-square bg-white border border-slate-200 rounded-2xl animate-pulse"></div>
      <div class="aspect-square bg-white border border-slate-200 rounded-2xl animate-pulse"></div>
      <div class="aspect-square bg-white border border-slate-200 rounded-2xl animate-pulse"></div>
      <div class="aspect-square bg-white border border-slate-200 rounded-2xl animate-pulse"></div>
    </div>
  </main>

  <!-- Photo Lightbox Modal (Clean, Immersive, Zero Black Letterbox) -->
  <div id="photo-modal" class="fixed inset-0 z-50 bg-slate-950/85 backdrop-blur-md hidden items-center justify-center p-3 sm:p-6 transition-all duration-300">
    <!-- Floating Close Button -->
    <button onclick="closeModal()" class="absolute top-4 right-4 sm:top-6 sm:right-6 z-30 w-11 h-11 rounded-full bg-white/10 hover:bg-white/25 text-white backdrop-blur-md border border-white/20 flex items-center justify-center shadow-lg transition active:scale-95" aria-label="Tutup">
      <i class="fi fi-rr-cross-small text-2xl"></i>
    </button>
    
    <!-- Modal Inner: Auto-fits image width/height without any surrounding black box -->
    <div class="relative max-w-[94vw] max-h-[92vh] inline-flex flex-col items-center justify-center">
      <!-- The Photo Itself: Naturally bounded, rounded, clean drop-shadow -->
      <img id="modal-img" src="" alt="Detail Foto" class="max-h-[76vh] sm:max-h-[80vh] max-w-[92vw] w-auto h-auto object-contain rounded-2xl shadow-2xl ring-1 ring-white/15 block bg-transparent">
      
      <!-- Sleek Floating Caption (Clean glassmorphism card that hugs content) -->
      <div id="modal-caption-wrap" class="mt-3.5 max-w-xl w-fit px-5 py-2.5 bg-slate-900/85 backdrop-blur-md border border-white/10 rounded-xl text-center shadow-xl">
        <h4 id="modal-title" class="text-xs sm:text-sm font-bold text-white leading-snug"></h4>
        <p id="modal-desc" class="text-[11px] sm:text-xs text-slate-300 mt-0.5 leading-relaxed"></p>
      </div>
    </div>
  </div>

  <!-- Site Footer Placeholder -->
  <div id="site-footer"></div>

  <!-- Scripts -->
  <script src="/shared/js/supabase-config.js" onerror="this.onerror=null;this.src='../shared/js/supabase-config.js'"></script>
  <script src="/shared/js/api.js" onerror="this.onerror=null;this.src='../shared/js/api.js'"></script>
  <script src="js/public-shell.js?v=20261024_wa"></script>
  <script>
    injectSiteChrome({ activeKey: 'gallery', basePath: './' });

    let galleryItems = [];

    function openModal(index) {
      const item = galleryItems[index];
      if (!item) return;
      document.getElementById('modal-img').src = item.image_url;
      document.getElementById('modal-title').textContent = item.title || 'Foto Dokumentasi Yayasan';
      const catText = item.category ? `[${item.category}] ` : '';
      const desc = item.description || item.content || '';
      const descEl = document.getElementById('modal-desc');
      if (desc && desc !== item.title) {
        descEl.textContent = catText + desc;
        descEl.classList.remove('hidden');
      } else if (item.category) {
        descEl.textContent = item.category;
        descEl.classList.remove('hidden');
      } else {
        descEl.classList.add('hidden');
      }
      const m = document.getElementById('photo-modal');
      m.classList.remove('hidden');
      m.classList.add('flex');
      document.body.style.overflow = 'hidden';
    }

    function closeModal() {
      const m = document.getElementById('photo-modal');
      m.classList.add('hidden');
      m.classList.remove('flex');
      document.body.style.overflow = '';
    }

    document.getElementById('photo-modal').addEventListener('click', (e) => {
      if (e.target.id === 'photo-modal' || e.target.closest('button')) {
        closeModal();
      }
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeModal();
    });

    async function loadGallery() {
      const grid = document.getElementById('gallery-grid');
      try {
        if (typeof apiCall === 'function') {
          const res = await apiCall('gallery', 'list', { per_page: 100 });
          if (res && res.success) {
            galleryItems = Array.isArray(res.data) ? res.data : ((res.data && res.data.items) || res.items || []);
          }
        }
      } catch (err) {
        console.warn('API gallery:', err);
      }

      if (!galleryItems || galleryItems.length === 0) {
        grid.innerHTML = `
          <div class="col-span-full py-16 px-4 text-center bg-white border border-slate-200/90 rounded-2xl shadow-sm">
            <div class="w-16 h-16 rounded-2xl bg-sky-50 text-primary-600 flex items-center justify-center mx-auto mb-4 border border-sky-100">
              <i class="fi fi-rr-picture text-2xl"></i>
            </div>
            <h3 class="text-base font-bold text-slate-800 mb-1">Belum Ada Foto Galeri</h3>
            <p class="text-xs sm:text-sm text-slate-500 max-w-md mx-auto leading-relaxed">
              Saat ini belum ada dokumentasi foto kegiatan yang dipublikasikan di galeri yayasan.
            </p>
          </div>
        `;
        return;
      }

      grid.innerHTML = galleryItems.map((g, i) => `
        <div onclick="openModal(${i})" class="group aspect-square bg-slate-100 rounded-2xl overflow-hidden relative cursor-pointer border border-slate-200/80 shadow-sm hover:shadow-md transition active:scale-[0.96]">
          <img src="${g.image_url}" alt="${g.title}" class="w-full h-full object-cover group-hover:scale-108 transition-transform duration-500" loading="lazy">
          <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-black/25 to-transparent opacity-0 group-hover:opacity-100 transition-opacity flex flex-col justify-end p-4 text-white">
            <span class="text-xs font-bold leading-snug line-clamp-1">${g.title}</span>
            ${g.category ? `<span class="text-[10px] text-sky-200 mt-0.5 font-medium">${g.category}</span>` : ''}
            <span class="text-[10px] text-sky-300 mt-1 inline-flex items-center gap-1 font-semibold">
              <i class="fi fi-rr-zoom-in text-[10px]"></i> Klik untuk perbesar
            </span>
          </div>
        </div>
      `).join('');
    }

    loadGallery();
  </script>
</body>
</html>
