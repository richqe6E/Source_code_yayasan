<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Kabar, berita kegiatan, dan prestasi terbaru dari Yayasan Samarinda.">
  <title>Berita &amp; Kegiatan - Yayasan Samarinda</title>

  <!-- Tailwind via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Flaticon Uicons -->
  <link rel="stylesheet" href="https://cdn-uicons.flaticon.com/2.6.0/uicons-regular-rounded/css/uicons-regular-rounded.css">
  <link rel="stylesheet" href="https://cdn-uicons.flaticon.com/2.6.0/uicons-solid-rounded/css/uicons-solid-rounded.css">
  <link rel="stylesheet" href="https://cdn-uicons.flaticon.com/2.6.0/uicons-bold-rounded/css/uicons-bold-rounded.css">
  <link rel="stylesheet" href="https://cdn-uicons.flaticon.com/2.6.0/uicons-brands/css/uicons-brands.css">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
          colors: {
            primary: {
              50:  '#F0F9FF',
              100: '#E0F2FE',
              200: '#BAE6FD',
              300: '#7DD3FC',
              400: '#38BDF8',
              500: '#0EA5E9',
              600: '#0284C7',
              700: '#0369A1',
              800: '#075985',
              900: '#0C4A6E',
              950: '#082F49'
            }
          }
        }
      }
    };
  </script>

  <link rel="stylesheet" href="css/style.css">
  <script src="/shared/js/page-transitions.js" onerror="this.onerror=null;this.src='../shared/js/page-transitions.js'"></script>
</head>
<body class="font-sans bg-slate-50 text-slate-800 antialiased selection:bg-primary-500 selection:text-white">

  <!-- Header Placeholder (Zero-Layout Shift pinned) -->
  <div id="site-header"></div>

  <!-- Hero Header Section -->
  <section class="bg-gradient-to-br from-primary-800 via-primary-900 to-slate-950 text-white py-14 sm:py-20 relative overflow-hidden">
    <div class="absolute inset-0 bg-[radial-gradient(circle_at_top_right,rgba(14,165,233,0.15),transparent_50%)]"></div>
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 relative z-10 text-center">
      <h1 class="text-3xl sm:text-5xl font-extrabold tracking-tight text-white mb-4 text-balance">
        Berita &amp; Kegiatan
      </h1>
      <p class="text-base sm:text-lg text-primary-100 max-w-2xl mx-auto leading-relaxed text-pretty">
        Informasi kegiatan belajar mengajar, prestasi santri, agenda sekolah, dan dokumentasi aktivitas Yayasan Samarinda.
      </p>
    </div>
  </section>

  <!-- Main Content Container -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12 sm:py-16">
    <!-- Category Filter Bar (Client-Side Instant Filter) -->
    <div class="flex flex-wrap items-center justify-between gap-4 mb-10 pb-6 border-b border-slate-200">
      <div class="flex flex-wrap items-center gap-2" id="category-filters">
        <button onclick="filterCategory('all', this)" class="category-btn active px-4 py-2 text-xs font-bold rounded-lg bg-primary-600 text-white shadow-sm transition active:scale-[0.98]">
          Semua Berita
        </button>
        <button onclick="filterCategory('kegiatan', this)" class="category-btn px-4 py-2 text-xs font-medium rounded-lg bg-white border border-slate-200 text-slate-700 hover:bg-slate-100 transition active:scale-[0.98]">
          Kegiatan Belajar
        </button>
        <button onclick="filterCategory('prestasi', this)" class="category-btn px-4 py-2 text-xs font-medium rounded-lg bg-white border border-slate-200 text-slate-700 hover:bg-slate-100 transition active:scale-[0.98]">
          Prestasi
        </button>
        <button onclick="filterCategory('parenting', this)" class="category-btn px-4 py-2 text-xs font-medium rounded-lg bg-white border border-slate-200 text-slate-700 hover:bg-slate-100 transition active:scale-[0.98]">
          Parenting &amp; Edukasi
        </button>
      </div>

      <!-- Search Input -->
      <div class="relative w-full sm:w-64">
        <i class="fi fi-rr-search absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
        <input type="text" id="news-search-input" oninput="handleSearch(this.value)" placeholder="Cari berita..." class="w-full pl-9 pr-4 py-2 bg-white border border-slate-200 rounded-lg text-xs focus:ring-2 focus:ring-primary-500 focus:outline-none transition">
      </div>
    </div>

    <!-- News Grid -->
    <div id="news-grid" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-6 sm:gap-8">
      <!-- Loading Skeleton Cards -->
      <div class="bg-white border border-slate-200 rounded-2xl overflow-hidden p-4 space-y-4 animate-pulse">
        <div class="aspect-video bg-slate-200 rounded-xl"></div>
        <div class="h-4 bg-slate-200 rounded w-1/3"></div>
        <div class="h-5 bg-slate-200 rounded w-4/5"></div>
        <div class="h-4 bg-slate-200 rounded w-full"></div>
      </div>
      <div class="bg-white border border-slate-200 rounded-2xl overflow-hidden p-4 space-y-4 animate-pulse">
        <div class="aspect-video bg-slate-200 rounded-xl"></div>
        <div class="h-4 bg-slate-200 rounded w-1/3"></div>
        <div class="h-5 bg-slate-200 rounded w-4/5"></div>
        <div class="h-4 bg-slate-200 rounded w-full"></div>
      </div>
      <div class="bg-white border border-slate-200 rounded-2xl overflow-hidden p-4 space-y-4 animate-pulse">
        <div class="aspect-video bg-slate-200 rounded-xl"></div>
        <div class="h-4 bg-slate-200 rounded w-1/3"></div>
        <div class="h-5 bg-slate-200 rounded w-4/5"></div>
        <div class="h-4 bg-slate-200 rounded w-full"></div>
      </div>
    </div>
  </main>

  <!-- Site Footer Placeholder -->
  <div id="site-footer"></div>

  <!-- Scripts -->
  <script src="/shared/js/supabase-config.js" onerror="this.onerror=null;this.src='../shared/js/supabase-config.js'"></script>
  <script src="/shared/js/api.js" onerror="this.onerror=null;this.src='../shared/js/api.js'"></script>
  <script src="js/public-shell.js"></script>
  <script src="js/app.js"></script>
  <script>
    injectSiteChrome({ activeKey: 'news', basePath: './' });

    let allNews = [];
    let currentCategory = 'all';
    let searchQuery = '';

    function formatDateIndo(dateStr) {
      if (!dateStr) return '';
      try {
        const d = new Date(dateStr);
        return d.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });
      } catch (_) {
        return dateStr;
      }
    }

    function renderNewsList(list) {
      const grid = document.getElementById('news-grid');
      if (!grid) return;

      if (!list || list.length === 0) {
        grid.innerHTML = `
          <div class="col-span-full py-16 text-center bg-white border border-slate-200 rounded-3xl p-8">
            <div class="w-14 h-14 bg-primary-50 text-primary-600 rounded-2xl flex items-center justify-center text-2xl mx-auto mb-3">
              <i class="fi fi-rr-info"></i>
            </div>
            <h3 class="text-base font-bold text-slate-800">Tidak ada berita ditemukan</h3>
            <p class="text-xs text-slate-500 mt-1 max-w-sm mx-auto">Silakan coba kata kunci lain atau pilih kategori Semua Berita.</p>
          </div>
        `;
        return;
      }

      grid.innerHTML = list.map(n => {
        const dateFormatted = formatDateIndo(n.published_at || n.created_at);
        const imageUrl = n.image || n.cover_url || n.image_url || n.featured_image_url || '';
        const category = n.category || 'Kegiatan';
        const title = n.title || 'Informasi Yayasan';
        const summary = n.summary || n.excerpt || n.content || '';

        return `
          <article class="bg-white border border-slate-200/90 rounded-2xl overflow-hidden shadow-sm hover:shadow-md transition-all duration-200 flex flex-col group active:scale-[0.99]">
            <a href="berita/detail.html?slug=${encodeURIComponent(n.slug || n.id)}" class="block aspect-video bg-gradient-to-br from-primary-100 to-slate-100 overflow-hidden relative">
              ${imageUrl ? `
                <img src="${imageUrl}" alt="${title}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" loading="lazy">
              ` : `
                <div class="w-full h-full flex flex-col items-center justify-center text-primary-700 p-4 text-center">
                  <i class="fi fi-rr-picture text-2xl mb-1 text-primary-500"></i>
                  <span class="text-xs font-bold">Yayasan Samarinda</span>
                </div>
              `}
              <span class="absolute top-3 left-3 px-2.5 py-1 rounded-md text-[11px] font-bold bg-white/95 text-primary-800 shadow-sm backdrop-blur-sm">
                ${category}
              </span>
            </a>

            <div class="p-5 flex-1 flex flex-col justify-between">
              <div>
                <div class="flex items-center gap-2 text-xs text-slate-400 mb-2">
                  <i class="fi fi-rr-calendar text-xs text-primary-600"></i>
                  <time class="tabular-nums font-medium">${dateFormatted}</time>
                </div>
                <h3 class="text-base font-bold text-slate-900 group-hover:text-primary-700 transition-colors line-clamp-2 leading-snug mb-2 text-balance">
                  <a href="berita/detail.html?slug=${encodeURIComponent(n.slug || n.id)}">
                    ${title}
                  </a>
                </h3>
                <p class="text-xs text-slate-600 line-clamp-2 leading-relaxed text-pretty mb-4">
                  ${summary}
                </p>
              </div>

              <div class="pt-3 border-t border-slate-100 flex items-center justify-between">
                <a href="berita/detail.html?slug=${encodeURIComponent(n.slug || n.id)}" class="text-xs font-bold text-primary-700 hover:text-primary-800 inline-flex items-center gap-1.5 group/btn">
                  <span>Baca Selengkapnya</span>
                  <i class="fi fi-rr-arrow-right text-[11px] group-hover/btn:translate-x-1 transition-transform"></i>
                </a>
                <span class="text-[11px] text-slate-400">3 mnt baca</span>
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    function applyFilterAndSearch() {
      let filtered = allNews;
      if (currentCategory !== 'all') {
        filtered = filtered.filter(n => (n.category || '').toLowerCase().includes(currentCategory.toLowerCase()));
      }
      if (searchQuery.trim()) {
        const q = searchQuery.toLowerCase();
        filtered = filtered.filter(n => (n.title || '').toLowerCase().includes(q) || (n.summary || '').toLowerCase().includes(q));
      }
      renderNewsList(filtered);
    }

    function filterCategory(cat, btn) {
      currentCategory = cat;
      document.querySelectorAll('.category-btn').forEach(b => {
        b.className = 'category-btn px-4 py-2 text-xs font-medium rounded-lg bg-white border border-slate-200 text-slate-700 hover:bg-slate-100 transition active:scale-[0.98]';
      });
      if (btn) {
        btn.className = 'category-btn active px-4 py-2 text-xs font-bold rounded-lg bg-primary-600 text-white shadow-sm transition active:scale-[0.98]';
      }
      applyFilterAndSearch();
    }

    function handleSearch(val) {
      searchQuery = val;
      applyFilterAndSearch();
    }

    async function loadNews() {
      try {
        if (typeof apiCall === 'function') {
          const res = await apiCall('news', 'list', { per_page: 30, is_published: 'true' });
          if (res && res.success) {
            allNews = Array.isArray(res.data) ? res.data : ((res.data && res.data.items) || res.items || []);
          }
        }
      } catch (err) {
        console.warn('API fetch news:', err);
      }

      // Default sample news if empty
      if (!allNews || allNews.length === 0) {
        allNews = [
          {
            id: '1',
            title: 'Keseruan Belajar Berbagi pada Peringatan Bulan Ramadhan 1447 H',
            category: 'Kegiatan',
            published_at: new Date().toISOString(),
            image: 'https://images.unsplash.com/photo-1577896851231-70ef18881754?q=80&w=1200&auto=format&fit=crop',
            summary: 'Santri cilik PAUD dan TK diajarkan kebiasaan berbagi takjil dan infaq ceria untuk melatih empati sosial sejak usia dini.'
          },
          {
            id: '2',
            title: 'Prestasi Juara 1 Lomba Mewarnai dan Hafalan Surat Pendek Tingkat Kota',
            category: 'Prestasi',
            published_at: new Date(Date.now() - 86400000 * 3).toISOString(),
            image: 'https://images.unsplash.com/photo-1503676260728-1c00da094a0b?q=80&w=1200&auto=format&fit=crop',
            summary: 'Alhamdulillah, ananda dari TK Terpadu Yayasan Samarinda meraih penghargaan dalam festival anak sholeh Samarinda.'
          },
          {
            id: '3',
            title: 'Sosialisasi Parenting: Pola Asuh Positif di Era Digital untuk Orang Tua',
            category: 'Parenting',
            published_at: new Date(Date.now() - 86400000 * 7).toISOString(),
            image: 'https://images.unsplash.com/photo-1509062522246-3755977927d7?q=80&w=1200&auto=format&fit=crop',
            summary: 'Kegiatan seminar interaktif menghadirkan psikolog anak membahas kiat mendampingi stimulasi gawai secara bijak.'
          }
        ];
      }

      applyFilterAndSearch();
    }

    loadNews();
  </script>
</body>
</html>
