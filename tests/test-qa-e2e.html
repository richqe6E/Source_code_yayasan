<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>E2E Test - SIYAYASAN QA Assistant UI</title>
  <link rel="stylesheet" href="../frontend/public/css/public-styles.css">
  <link rel="stylesheet" href="../frontend/public/css/qa-assistant.css">
  <style>
    body { padding: 40px; background: #0f172a; color: #f8fafc; font-family: sans-serif; }
    #log { background: #1e293b; color: #38bdf8; padding: 20px; border-radius: 8px; font-family: monospace; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>UI Integration Verification - Asisten Informasi</h1>
  <div id="log">Running tests...</div>

  <script src="../frontend/public/js/qa-knowledge-base.js"></script>
  <script src="../frontend/public/js/qa-assistant.js"></script>
  <script>
    const logEl = document.getElementById('log');
    let passes = 0;
    let fails = 0;

    function assert(desc, cond) {
      if (cond) {
        passes++;
        logEl.textContent += ' [PASS] ' + desc + '\n';
      } else {
        fails++;
        logEl.textContent += ' [FAIL] ' + desc + '\n';
      }
    }

    try {
      assert('SiyQaEngine exists', !!window.SiyQaEngine);
      window.initSiyQaAssistant('../frontend/public/');
      assert('initSiyQaAssistant executed without throwing', true);

      const triggerBtn = document.getElementById('site-floating-qa');
      const modal = document.getElementById('siy-qa-modal');
      const chatBody = document.getElementById('qa-chat-messages');
      const chipsList = document.getElementById('qa-chips-list');
      const chipsWrapper = document.getElementById('qa-suggestions-area');
      const toggleChipsBtn = document.getElementById('qa-btn-toggle-suggestions');
      const input = document.getElementById('qa-input-text');
      const form = document.getElementById('qa-chat-form');

      assert('site-floating-qa trigger button found', !!triggerBtn);
      assert('siy-qa-modal modal container found', !!modal);
      assert('qa-chat-messages body found', !!chatBody);
      assert('qa-chips-list container found', !!chipsList);
      assert('qa-suggestions-area wrapper found', !!chipsWrapper);
      assert('qa-btn-toggle-suggestions toggle button found', !!toggleChipsBtn);
      assert('qa-input-text field found', !!input);

      // Modal open test
      triggerBtn.click();
      assert('Modal opened with .is-open class', modal.classList.contains('is-open'));

      // Dimension check
      const modalRect = modal.getBoundingClientRect();
      assert('Modal desktop width >= 380px (actual: ' + Math.round(modalRect.width) + 'px)', modalRect.width >= 380);

      // Suggestions check
      assert('Quick chips rendered (count: ' + chipsList.children.length + ')', chipsList.children.length >= 4);

      // Toggle collapse/expand check
      toggleChipsBtn.click();
      assert('Suggestions collapsible (.is-collapsed)', chipsWrapper.classList.contains('is-collapsed'));
      toggleChipsBtn.click();
      assert('Suggestions expandable', !chipsWrapper.classList.contains('is-collapsed'));

      // Test input focus auto-collapses chips
      input.dispatchEvent(new Event('focus'));
      assert('Focusing input auto-collapses suggestions', chipsWrapper.classList.contains('is-collapsed'));

      // Single live chat submission test
      input.value = 'bagaimana cara mendaftar?';
      form.dispatchEvent(new Event('submit', { cancelable: true }));

      setTimeout(() => {
        const assistantMsgs = chatBody.querySelectorAll('.qa-message-row.assistant');
        const lastMsg = assistantMsgs[assistantMsgs.length - 1];
        assert('Assistant responded to live submission', !!lastMsg);
        assert('Response contains registration information', lastMsg && (lastMsg.textContent.includes('PPDB Online') || lastMsg.textContent.includes('Yayasan')));

        if (fails === 0) {
          document.title = 'E2E_PASS_ALL';
          logEl.textContent += '\nALL ' + passes + ' E2E UI TESTS PASSED 100%!\n';
        } else {
          document.title = 'E2E_FAIL';
          logEl.textContent += '\nE2E TESTS HAD ' + fails + ' FAILURES.\n';
        }
      }, 400);

    } catch (e) {
      logEl.textContent += '\n[FATAL ERROR] ' + e.message + '\n';
      document.title = 'E2E_ERROR';
    }
  </script>
</body>
</html>
