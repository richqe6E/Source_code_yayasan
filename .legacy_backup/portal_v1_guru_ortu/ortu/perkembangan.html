<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perkembangan Anak - Yayasan Samarinda</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter','system-ui','sans-serif'] }, colors: { primary: { 50:'#F0F9FF',500:'#0EA5E9',600:'#0284C7',700:'#0369A1',800:'#075985',900:'#0C4A6E' } } } } }
  </script>
  <link rel="stylesheet" href="../../public/css/style.css">
</head>
<body class="font-sans bg-gray-50 text-gray-800 antialiased">
  <div id="app-shell"></div>

  <main class="p-4 sm:p-6 lg:p-8">
    <div id="error-banner" class="hidden mb-4 p-4 rounded-lg bg-red-50 border border-red-200 text-red-800 text-sm flex items-center justify-between">
      <div class="flex items-center gap-2">
        <svg class="w-5 h-5 text-red-600 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        <span id="error-message">Terjadi kesalahan</span>
      </div>
      <button onclick="load()" class="text-xs font-semibold px-2.5 py-1 bg-red-100 hover:bg-red-200 rounded text-red-800">Coba Lagi</button>
    </div>

    <div class="bg-white border border-gray-200 rounded-lg p-4 mb-4 shadow-sm">
      <div class="grid sm:grid-cols-3 gap-3">
        <div>
          <label class="block text-xs font-medium text-gray-600 mb-1">Pilih Anak</label>
          <select id="dev-student" onchange="load()" class="w-full px-3 py-2 border border-gray-300 rounded-md text-sm focus:ring-2 focus:ring-primary-500 focus:border-transparent"></select>
        </div>
        <div>
          <label class="block text-xs font-medium text-gray-600 mb-1">Semester</label>
          <select id="dev-semester" onchange="load()" class="w-full px-3 py-2 border border-gray-300 rounded-md text-sm focus:ring-2 focus:ring-primary-500 focus:border-transparent">
            <option value="1">Semester 1 (Ganjil)</option>
            <option value="2">Semester 2 (Genap)</option>
          </select>
        </div>
        <div class="flex items-end">
          <button onclick="load()" class="w-full px-4 py-2 bg-primary-600 text-white text-sm font-semibold rounded-md hover:bg-primary-700 transition-colors">
            Tampilkan Catatan
          </button>
        </div>
      </div>
    </div>

    <div id="dev-area" class="bg-white border border-gray-200 rounded-lg p-6 shadow-sm">
      <div id="dev-content">
        <div class="text-sm text-gray-400 text-center py-8 animate-pulse">Memuat data perkembangan...</div>
      </div>
    </div>
  </main>

  <script src="../../shared/js/auth.js"></script>
  <script src="../../shared/js/api.js"></script>
  <script src="../../shared/js/shell.js"></script>
  <script>
    requireAuth('orang_tua,pendaftar');

    const MENU = [
      { href: 'dashboard.html', label: 'Dashboard' },
      { href: 'anak.html', label: 'Anak Saya' },
      { href: 'presensi.html', label: 'Presensi' },
      { href: 'perkembangan.html', label: 'Perkembangan' },
      { href: 'tagihan.html', label: 'Tagihan' },
      { href: 'pengumuman.html', label: 'Pengumuman' },
      { href: 'profile.html', label: 'Profil' }
    ];

    Shell.init({
      menu: MENU,
      active: 'perkembangan.html',
      portalLabel: 'Portal Orang Tua',
      title: 'Catatan Perkembangan',
      subtitle: 'Hasil penilaian capaian 6 aspek tumbuh kembang anak',
      showRefresh: true,
      onRefresh: load
    });

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[m]);
    }

    async function loadChildren() {
      const qp = new URLSearchParams(window.location.search);
      const targetStudent = qp.get('student_id');

      const res = await apiCall('students', 'myChildren');
      const sel = document.getElementById('dev-student');
      const rawList = res.data && res.data.children ? res.data.children : (Array.isArray(res.data) ? res.data : []);
      const children = rawList.map(item => {
        const s = item.student || item;
        const cls = item.class || {};
        return {
          id: s.id,
          full_name: s.full_name || '-',
          class_name: cls.name || s.class_name || 'Tanpa Kelas'
        };
      });

      if (res.success && children.length > 0) {
        sel.innerHTML = children.map(c => `
          <option value="${c.id}" ${targetStudent === c.id ? 'selected' : ''}>
            ${escapeHtml(c.full_name)} (${escapeHtml(c.class_name)})
          </option>
        `).join('');
        if (children.length === 1) {
          sel.disabled = true;
          sel.classList.add('bg-gray-50', 'text-gray-900', 'font-semibold', 'cursor-default');
          const lbl = sel.previousElementSibling;
          if (lbl) lbl.textContent = 'Data Anak Terdaftar';
        }
      } else {
        sel.innerHTML = '<option value="">(Belum ada anak terhubung)</option>';
      }
      load();
    }

    async function load() {
      const studentId = document.getElementById('dev-student').value;
      const semester = document.getElementById('dev-semester').value;
      const content = document.getElementById('dev-content');
      const errBanner = document.getElementById('error-banner');
      errBanner.classList.add('hidden');

      if (!studentId) {
        content.innerHTML = '<div class="text-sm text-gray-500 text-center py-8">Pilih data anak terlebih dahulu.</div>';
        return;
      }

      content.innerHTML = `
        <div class="space-y-4 animate-pulse">
          <div class="h-4 bg-gray-200 rounded w-1/3"></div>
          <div class="grid sm:grid-cols-2 gap-3">
            <div class="h-16 bg-gray-100 rounded-md"></div>
            <div class="h-16 bg-gray-100 rounded-md"></div>
            <div class="h-16 bg-gray-100 rounded-md"></div>
            <div class="h-16 bg-gray-100 rounded-md"></div>
          </div>
        </div>
      `;

      try {
        const res = await apiCall('development', 'list', { student_id: studentId, semester });
        if (!res.success) {
          errBanner.classList.remove('hidden');
          document.getElementById('error-message').textContent = res.message || 'Gagal memuat catatan perkembangan';
          content.innerHTML = `<div class="text-sm text-red-600 text-center py-8">${escapeHtml(res.message || 'Gagal memuat data')}</div>`;
          return;
        }

        if (!res.data || res.data.length === 0) {
          content.innerHTML = `
            <div class="text-center py-10">
              <div class="w-12 h-12 bg-amber-50 text-amber-600 rounded-full flex items-center justify-center mx-auto mb-2">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
              </div>
              <p class="text-sm font-medium text-gray-800">Belum Ada Catatan Perkembangan</p>
              <p class="text-xs text-gray-500 mt-1">Guru kelas belum menginputkan penilaian semester ini untuk anak Anda.</p>
            </div>
          `;
          return;
        }

        const r = res.data[0];
        content.innerHTML = `
          <div class="flex flex-col sm:flex-row sm:items-center justify-between pb-4 mb-4 border-b border-gray-100 gap-2">
            <div>
              <div class="text-base font-bold text-gray-900">${escapeHtml(r.student_name || 'Siswa')}</div>
              <div class="text-xs text-gray-500">Tahun Ajaran: ${escapeHtml(r.academic_year || '-')} • Semester ${escapeHtml(r.semester)}</div>
            </div>
            <div class="text-xs text-gray-400">
              Keterangan: <span class="text-green-700 font-semibold">BSB</span> (Sangat Baik), <span class="text-blue-700 font-semibold">BSH</span> (Sesuai Harapan), <span class="text-yellow-700 font-semibold">MB</span> (Mulai Berkembang), <span class="text-red-700 font-semibold">BB</span> (Belum Berkembang)
            </div>
          </div>
          <div class="grid sm:grid-cols-2 gap-3 mb-5">
            ${aspect('Nilai Agama &amp; Moral', r.nilai_agama || r.nam || r.aspect_nam)}
            ${aspect('Fisik &amp; Motorik', r.fisik_motorik || r.aspect_fisik_motorik)}
            ${aspect('Kognitif', r.kognitif || r.aspect_kognitif)}
            ${aspect('Bahasa &amp; Komunikasi', r.bahasa || r.aspect_bahasa)}
            ${aspect('Sosial &amp; Emosional', r.sosial_emosional || r.aspect_sosial_emosional)}
            ${aspect('Seni &amp; Kreativitas', r.seni || r.aspect_seni)}
          </div>
          ${r.teacher_notes || r.teacher_note ? `
            <div class="bg-gray-50 border border-gray-200 rounded-lg p-4">
              <div class="text-xs font-bold text-gray-700 mb-1 flex items-center gap-1.5">
                <svg class="w-4 h-4 text-primary-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 8h10M7 12h4m1 8l-4-4H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-3l-4 4z"/></svg>
                Pesan &amp; Catatan Guru Kelas
              </div>
              <div class="text-sm text-gray-700 leading-relaxed whitespace-pre-line">${escapeHtml(r.teacher_note)}</div>
            </div>` : ''}
        `;
      } catch (e) {
        errBanner.classList.remove('hidden');
        document.getElementById('error-message').textContent = 'Koneksi terganggu saat memuat catatan';
        content.innerHTML = '<div class="text-sm text-red-600 text-center py-8">Koneksi terganggu</div>';
      }
    }

    function aspect(name, predikat) {
      const colors = {
        BB: 'bg-red-100 text-red-800 border-red-200',
        MB: 'bg-yellow-100 text-yellow-800 border-yellow-200',
        BSH: 'bg-blue-100 text-blue-800 border-blue-200',
        BSB: 'bg-green-100 text-green-800 border-green-200'
      };
      const p = (predikat || '').toUpperCase();
      return `
        <div class="border border-gray-200 rounded-lg p-3 bg-white flex justify-between items-center shadow-xs">
          <div>
            <div class="text-xs font-semibold text-gray-800">${name}</div>
            <div class="text-[11px] text-gray-400 mt-0.5">Capaian perkembangan</div>
          </div>
          <span class="px-3 py-1 text-xs rounded-md border ${colors[p] || 'bg-gray-100 text-gray-700 border-gray-200'} font-bold tabular-nums">
            ${escapeHtml(p || '-')}
          </span>
        </div>`;
    }

    loadChildren();
  </script>
</body>
</html>
