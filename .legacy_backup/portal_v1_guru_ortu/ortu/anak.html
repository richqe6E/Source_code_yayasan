<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anak Saya - Yayasan Samarinda</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter','system-ui','sans-serif'] }, colors: { primary: { 50:'#F0F9FF',500:'#0EA5E9',600:'#0284C7',700:'#0369A1',800:'#075985',900:'#0C4A6E' } } } } }
  </script>
  <link rel="stylesheet" href="../../public/css/style.css">
</head>
<body class="font-sans bg-gray-50 text-gray-800 antialiased">
  <div id="app-shell"></div>

  <main class="p-4 sm:p-6 lg:p-8">
    <div id="error-banner" class="hidden mb-4 p-4 rounded-lg bg-red-50 border border-red-200 text-red-800 text-sm flex items-center justify-between">
      <div class="flex items-center gap-2">
        <svg class="w-5 h-5 text-red-600 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        <span id="error-message">Terjadi kesalahan</span>
      </div>
      <button onclick="load()" class="text-xs font-semibold px-2.5 py-1 bg-red-100 hover:bg-red-200 rounded text-red-800">Coba Lagi</button>
    </div>

    <div id="children-grid" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-4">
      <div class="bg-white border border-gray-200 rounded-lg p-5 animate-pulse">
        <div class="flex items-center gap-3 mb-4">
          <div class="w-12 h-12 bg-gray-200 rounded-full"></div>
          <div class="space-y-2 flex-1"><div class="h-4 bg-gray-200 rounded w-24"></div><div class="h-3 bg-gray-200 rounded w-16"></div></div>
        </div>
        <div class="space-y-2"><div class="h-3 bg-gray-200 rounded"></div><div class="h-3 bg-gray-200 rounded"></div></div>
      </div>
    </div>
  </main>

  <script src="../../shared/js/auth.js"></script>
  <script src="../../shared/js/api.js"></script>
  <script src="../../shared/js/shell.js"></script>
  <script>
    requireAuth('orang_tua,pendaftar,super_admin,admin_tu');

    const MENU = [
      { href: 'dashboard.html', label: 'Dashboard' },
      { href: 'anak.html', label: 'Anak Saya' },
      { href: 'presensi.html', label: 'Presensi' },
      { href: 'perkembangan.html', label: 'Perkembangan' },
      { href: 'tagihan.html', label: 'Tagihan' },
      { href: 'pengumuman.html', label: 'Pengumuman' },
      { href: 'profile.html', label: 'Profil' }
    ];

    Shell.init({
      menu: MENU,
      active: 'anak.html',
      portalLabel: 'Portal Orang Tua',
      title: 'Anak Saya',
      subtitle: 'Data anak yang terhubung dengan akun Anda',
      showRefresh: true,
      onRefresh: load
    });

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[m]);
    }

    async function load() {
      const grid = document.getElementById('children-grid');
      const errBanner = document.getElementById('error-banner');
      errBanner.classList.add('hidden');
      grid.innerHTML = `
        <div class="bg-white border border-gray-200 rounded-lg p-5 animate-pulse">
          <div class="flex items-center gap-3 mb-4">
            <div class="w-12 h-12 bg-gray-200 rounded-full"></div>
            <div class="space-y-2 flex-1"><div class="h-4 bg-gray-200 rounded w-32"></div><div class="h-3 bg-gray-200 rounded w-20"></div></div>
          </div>
          <div class="space-y-2"><div class="h-3 bg-gray-200 rounded w-full"></div><div class="h-3 bg-gray-200 rounded w-3/4"></div></div>
        </div>
      `;

      try {
        const res = await apiCall('students', 'myChildren');
        if (!res.success) {
          errBanner.classList.remove('hidden');
          document.getElementById('error-message').textContent = res.message || 'Gagal memuat data anak';
          grid.innerHTML = `<div class="col-span-full p-8 text-center text-sm text-red-600 bg-white border border-gray-200 rounded-lg">${escapeHtml(res.message || 'Gagal')}</div>`;
          return;
        }

        const rawList = res.data && res.data.children ? res.data.children : (Array.isArray(res.data) ? res.data : []);
        const children = rawList.map(item => {
          const s = item.student || item;
          const cls = item.class || {};
          return {
            id: s.id,
            full_name: s.full_name || '-',
            nis: s.nis || '-',
            gender: s.gender,
            birth_date: s.birth_date,
            class_name: cls.name || s.class_name || '-'
          };
        });

        if (children.length === 0) {
          grid.innerHTML = `
            <div class="col-span-full bg-white border border-gray-200 rounded-lg p-8 text-center">
              <div class="w-12 h-12 bg-primary-50 text-primary-600 rounded-full flex items-center justify-center mx-auto mb-3">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
              </div>
              <p class="text-sm font-medium text-gray-900 mb-1">Belum Ada Data Anak Terhubung</p>
              <p class="text-xs text-gray-500 max-w-sm mx-auto">Jika Anda baru mendaftar melalui PPDB atau siswa pindahan, silakan hubungi pihak Tata Usaha yayasan untuk verifikasi penautan akun.</p>
            </div>
          `;
          return;
        }

        grid.innerHTML = children.map(c => `
          <div class="bg-white border border-gray-200 rounded-lg p-5 shadow-sm hover:border-primary-200 transition-colors">
            <div class="flex items-center gap-3 mb-4">
              <div class="w-12 h-12 bg-primary-100 text-primary-700 rounded-full flex items-center justify-center font-bold text-base shadow-sm">
                ${escapeHtml((c.full_name || 'A').charAt(0).toUpperCase())}
              </div>
              <div class="min-w-0">
                <div class="text-sm font-bold text-gray-900 truncate">${escapeHtml(c.full_name)}</div>
                <div class="text-xs text-gray-500 font-mono tabular-nums">NIS: ${escapeHtml(c.nis || '-')}</div>
              </div>
            </div>
            <dl class="space-y-1.5 text-xs text-gray-600 pb-3 border-b border-gray-100">
              <div class="flex justify-between items-center"><dt class="text-gray-500">Kelas</dt><dd class="font-medium text-gray-800">${escapeHtml(c.class_name || '-')}</dd></div>
              <div class="flex justify-between items-center"><dt class="text-gray-500">Jenis Kelamin</dt><dd class="font-medium text-gray-800">${c.gender === 'L' ? 'Laki-laki' : 'Perempuan'}</dd></div>
              <div class="flex justify-between items-center"><dt class="text-gray-500">Tanggal Lahir</dt><dd class="font-medium text-gray-800 tabular-nums">${escapeHtml(c.birth_date ? formatDate(c.birth_date) : '-')}</dd></div>
            </dl>
            <div class="mt-3 flex gap-2 text-xs">
              <a href="presensi.html?student_id=${encodeURIComponent(c.id)}" class="flex-1 text-center py-1.5 bg-primary-50 text-primary-700 font-medium rounded hover:bg-primary-100 transition-colors">
                Presensi
              </a>
              <a href="perkembangan.html?student_id=${encodeURIComponent(c.id)}" class="flex-1 text-center py-1.5 bg-emerald-50 text-emerald-700 font-medium rounded hover:bg-emerald-100 transition-colors">
                Perkembangan
              </a>
            </div>
          </div>`).join('');
      } catch (e) {
        errBanner.classList.remove('hidden');
        document.getElementById('error-message').textContent = 'Koneksi gagal atau sesi telah berakhir';
        grid.innerHTML = '<div class="col-span-full p-8 text-center text-sm text-red-600 bg-white border border-gray-200 rounded-lg">Koneksi terganggu</div>';
      }
    }

    load();
  </script>
</body>
</html>
