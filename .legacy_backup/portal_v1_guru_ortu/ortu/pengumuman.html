<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pengumuman - Yayasan Samarinda</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter','system-ui','sans-serif'] }, colors: { primary: { 50:'#F0F9FF',500:'#0EA5E9',600:'#0284C7',700:'#0369A1',800:'#075985',900:'#0C4A6E' } } } } }
  </script>
  <link rel="stylesheet" href="../../public/css/style.css">
</head>
<body class="font-sans bg-gray-50 text-gray-800 antialiased">
  <div id="app-shell"></div>

  <main class="p-4 sm:p-6 lg:p-8 max-w-4xl">
    <div id="error-banner" class="hidden mb-4 p-4 rounded-lg bg-red-50 border border-red-200 text-red-800 text-sm flex items-center justify-between">
      <div class="flex items-center gap-2">
        <svg class="w-5 h-5 text-red-600 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        <span id="error-message">Terjadi kesalahan</span>
      </div>
      <button onclick="load()" class="text-xs font-semibold px-2.5 py-1 bg-red-100 hover:bg-red-200 rounded text-red-800">Coba Lagi</button>
    </div>

    <div id="ann-list" class="space-y-4">
      <div class="bg-white border border-gray-200 rounded-lg p-5 animate-pulse space-y-3">
        <div class="h-4 bg-gray-200 rounded w-1/4"></div>
        <div class="h-5 bg-gray-200 rounded w-3/4"></div>
        <div class="h-3 bg-gray-200 rounded w-1/3"></div>
        <div class="h-16 bg-gray-100 rounded"></div>
      </div>
    </div>
  </main>

  <script src="../../shared/js/auth.js"></script>
  <script src="../../shared/js/api.js"></script>
  <script src="../../shared/js/shell.js"></script>
  <script>
    requireAuth();

    const MENU = [
      { href: 'dashboard.html', label: 'Dashboard' },
      { href: 'anak.html', label: 'Anak Saya' },
      { href: 'presensi.html', label: 'Presensi' },
      { href: 'perkembangan.html', label: 'Perkembangan' },
      { href: 'tagihan.html', label: 'Tagihan' },
      { href: 'pengumuman.html', label: 'Pengumuman' },
      { href: 'profile.html', label: 'Profil' }
    ];

    Shell.init({
      menu: MENU,
      active: 'pengumuman.html',
      portalLabel: 'Portal Orang Tua',
      title: 'Pengumuman',
      subtitle: 'Informasi dan pengumuman resmi yayasan',
      showRefresh: true,
      onRefresh: load
    });

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[m]);
    }

    async function load() {
      const list = document.getElementById('ann-list');
      const errBanner = document.getElementById('error-banner');
      errBanner.classList.add('hidden');
      list.innerHTML = `
        <div class="bg-white border border-gray-200 rounded-lg p-5 animate-pulse space-y-3">
          <div class="h-3 bg-gray-200 rounded w-20"></div>
          <div class="h-5 bg-gray-200 rounded w-2/3"></div>
          <div class="h-3 bg-gray-200 rounded w-32"></div>
          <div class="h-12 bg-gray-100 rounded"></div>
        </div>
      `;

      try {
        const res = await apiCall('announcements', 'list', { per_page: 50 });
        if (!res.success) {
          list.innerHTML = `
            <div class="bg-white border border-gray-200 rounded-lg p-10 text-center">
              <div class="w-12 h-12 bg-gray-100 text-gray-500 rounded-full flex items-center justify-center mx-auto mb-2">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2 13a2 2 0 01-2-2V7m2 13a2 2 0 002-2V9a2 2 0 00-2-2h-2m-4-3H9M7 16h6M7 8h6v4H7V8z"/></svg>
              </div>
              <p class="text-sm font-medium text-gray-800">Belum Ada Pengumuman</p>
              <p class="text-xs text-gray-500 mt-1">Pengumuman dan edaran resmi yayasan akan ditampilkan di sini.</p>
            </div>
          `;
          return;
        }

        const items = res.data || [];
        if (items.length === 0) {
          list.innerHTML = `
            <div class="bg-white border border-gray-200 rounded-lg p-10 text-center">
              <div class="w-12 h-12 bg-gray-100 text-gray-500 rounded-full flex items-center justify-center mx-auto mb-2">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2 13a2 2 0 01-2-2V7m2 13a2 2 0 002-2V9a2 2 0 00-2-2h-2m-4-3H9M7 16h6M7 8h6v4H7V8z"/></svg>
              </div>
              <p class="text-sm font-medium text-gray-800">Belum Ada Pengumuman</p>
              <p class="text-xs text-gray-500 mt-1">Pengumuman dan edaran resmi yayasan akan ditampilkan di sini.</p>
            </div>
          `;
          return;
        }

        list.innerHTML = items.map(a => `
          <div class="bg-white border border-gray-200 rounded-lg p-6 shadow-sm hover:border-primary-200 transition-colors">
            <div class="flex items-center gap-2 mb-2">
              <span class="inline-flex items-center px-2 py-0.5 rounded text-[11px] font-bold uppercase tracking-wider bg-primary-100 text-primary-800">
                PENGUMUMAN
              </span>
              <span class="text-xs text-gray-400 tabular-nums">${formatDateTime(a.created_at)}</span>
              ${a.author_name ? `<span class="text-xs text-gray-400">• Oleh: ${escapeHtml(a.author_name)}</span>` : ''}
            </div>
            <h3 class="text-base font-bold text-gray-900 mb-2 leading-snug">${escapeHtml(a.title)}</h3>
            <div class="text-sm text-gray-700 leading-relaxed whitespace-pre-line border-t border-gray-100 pt-3">${escapeHtml(a.content || a.excerpt || '')}</div>
          </div>`).join('');
      } catch (e) {
        errBanner.classList.remove('hidden');
        document.getElementById('error-message').textContent = 'Koneksi terganggu saat memuat pengumuman';
        list.innerHTML = '<div class="p-8 text-center text-sm text-red-600 bg-white border border-gray-200 rounded-lg">Koneksi terganggu</div>';
      }
    }

    load();
  </script>
</body>
</html>
