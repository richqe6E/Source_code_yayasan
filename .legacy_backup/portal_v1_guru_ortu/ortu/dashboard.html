<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Orang Tua - Yayasan Samarinda</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter','system-ui','sans-serif'] }, colors: { primary: { 50:'#F0F9FF',500:'#0EA5E9',600:'#0284C7',700:'#0369A1',800:'#075985',900:'#0C4A6E' } } } } }
  </script>
  <link rel="stylesheet" href="../../public/css/style.css">
  <style>
    .skeleton { background: linear-gradient(90deg, #f3f4f6 0%, #e5e7eb 50%, #f3f4f6 100%); background-size: 200% 100%; animation: shimmer 1.4s ease-in-out infinite; }
    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    #mobile-nav { transition: transform 0.25s ease; }
    #mobile-nav[aria-hidden="true"] { transform: translateX(-100%); }
    .nav-item { display:flex; align-items:center; gap:0.75rem; padding:0.5rem 0.75rem; font-size:0.875rem; font-weight:500; border-radius:0.375rem; color:#374151; }
    .nav-item:hover { background-color:#F9FAFB; }
    .nav-active { background-color:#F0F9FF; color:#0369A1; }
  </style>
</head>
<body class="font-sans bg-gray-50 text-gray-800">
  <div id="app-shell"></div>

  <main class="p-4 sm:p-6 lg:p-8">
    <div id="error-banner" role="alert" class="hidden mb-4 p-4 bg-red-50 border border-red-200 rounded-md flex items-start justify-between gap-3">
      <div class="min-w-0">
        <div class="text-sm font-medium text-red-800">Gagal memuat data dashboard</div>
        <div id="error-message" class="text-xs text-red-700 mt-1 break-words"></div>
      </div>
      <button onclick="refresh()" class="shrink-0 text-sm font-medium text-red-700 hover:text-red-900 underline">Coba lagi</button>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-6">
      <div class="bg-white border border-gray-200 rounded-lg p-5 min-w-0">
        <div class="text-sm text-gray-600 truncate">Anak Terdaftar</div>
        <div class="text-2xl font-bold text-gray-900 tabular-nums truncate" id="stat-children"><div class="skeleton h-7 w-12 rounded"></div></div>
      </div>
      <div class="bg-white border border-gray-200 rounded-lg p-5 min-w-0">
        <div class="text-sm text-gray-600 truncate">Tagihan Aktif</div>
        <div class="text-2xl font-bold text-red-700 tabular-nums truncate" id="stat-bills"><div class="skeleton h-7 w-12 rounded"></div></div>
      </div>
      <div class="bg-white border border-gray-200 rounded-lg p-5 min-w-0">
        <div class="text-sm text-gray-600 truncate">Presensi Bulan Ini</div>
        <div class="text-2xl font-bold text-gray-900 tabular-nums truncate" id="stat-attendance"><div class="skeleton h-7 w-16 rounded"></div></div>
      </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
      <div class="bg-white border border-gray-200 rounded-lg p-5">
        <h2 class="text-base font-semibold text-gray-900 mb-3">Pengumuman Terbaru</h2>
        <div id="ann-list" class="text-sm text-gray-600 space-y-2">Memuat...</div>
      </div>
      <div class="bg-white border border-gray-200 rounded-lg p-5">
        <h2 class="text-base font-semibold text-gray-900 mb-3">Akses Cepat</h2>
        <div class="space-y-2">
          <a href="tagihan.html" class="flex items-center justify-between p-3 bg-gray-50 hover:bg-gray-100 rounded-md text-sm"><span>Lihat Tagihan</span><span class="text-primary-700">→</span></a>
          <a href="presensi.html" class="flex items-center justify-between p-3 bg-gray-50 hover:bg-gray-100 rounded-md text-sm"><span>Riwayat Presensi Anak</span><span class="text-primary-700">→</span></a>
          <a href="perkembangan.html" class="flex items-center justify-between p-3 bg-gray-50 hover:bg-gray-100 rounded-md text-sm"><span>Catatan Perkembangan</span><span class="text-primary-700">→</span></a>
        </div>
      </div>
    </div>
  </main>

  <script src="../../shared/js/auth.js"></script>
  <script src="../../shared/js/api.js"></script>
  <script src="../../shared/js/shell.js"></script>
  <script>
    requireAuth();

    const MENU = [
      { href: 'dashboard.html', label: 'Dashboard' },
      { href: 'anak.html', label: 'Anak Saya' },
      { href: 'presensi.html', label: 'Presensi' },
      { href: 'perkembangan.html', label: 'Perkembangan' },
      { href: 'tagihan.html', label: 'Tagihan' },
      { href: 'pengumuman.html', label: 'Pengumuman' },
      { href: 'profile.html', label: 'Profil' }
    ];

    Shell.init({
      menu: MENU,
      active: 'dashboard.html',
      portalLabel: 'Portal Orang Tua',
      title: 'Dashboard Orang Tua',
      subtitle: 'Portal orang tua murid yayasan',
      showRefresh: true,
      onRefresh: load
    });

    function setText(id, val) {
      const el = document.getElementById(id);
      if (!el) return;
      el.textContent = (val === null || val === undefined || val === '') ? '-' : val;
    }

    async function load() {
      Shell.hideError();
      const stopSpin = Shell.startRefresh();
      try {
        try {
          const me = await apiCall('students', 'myChildren');
          if (me && me.success) {
            // Backend return {items: [...], students: [...], total}; apiCall auto-unwrap ke array
            const children = Array.isArray(me.data) ? me.data : (me.data && (me.data.items || me.data.children) || []);
            setText('stat-children', children.length);
          } else {
            setText('stat-children', 0);
          }
        } catch (e) {
          setText('stat-children', 0);
        }

        try {
          const bills = await apiCall('invoices', 'list', { status: 'unpaid' });
          if (bills && bills.success) {
            const billItems = Array.isArray(bills.data) ? bills.data : ((bills.data && bills.data.items) || []);
            setText('stat-bills', billItems.length);
          } else {
            setText('stat-bills', 0);
          }
        } catch (e) {
          setText('stat-bills', 0);
        }

        try {
          const att = await apiCall('attendance', 'summary', { period: 'month' });
          if (att && att.success && att.data) {
            setText('stat-attendance', (att.data.pct_hadir || 0) + '%');
          } else {
            setText('stat-attendance', '0%');
          }
        } catch (e) {
          setText('stat-attendance', '0%');
        }

        try {
          const ann = await apiCall('announcements', 'list', { per_page: 5 });
          const annList = document.getElementById('ann-list');
          if (annList) {
            if (ann && ann.success) {
              const annItems = Array.isArray(ann.data) ? ann.data : ((ann.data && ann.data.items) || []);
              annList.innerHTML = annItems.length === 0
                ? '<div class="text-gray-500 text-sm">Tidak ada pengumuman.</div>'
                : annItems.map(a => `<div class="py-2 border-b border-gray-100 last:border-0"><div class="font-medium text-gray-900">${a.title}</div><div class="text-xs text-gray-500">${window.formatDate ? window.formatDate(a.created_at || a.published_at) : (a.created_at || a.published_at || '')}</div><div class="text-xs text-gray-600 mt-1 line-clamp-2">${a.excerpt || a.content || ''}</div></div>`).join('');
            } else {
              annList.innerHTML = '<div class="text-gray-500 text-sm">Belum ada pengumuman untuk saat ini.</div>';
            }
          }
        } catch (e) {
          const annList = document.getElementById('ann-list');
          if (annList) annList.innerHTML = '<div class="text-gray-500 text-sm">Belum ada pengumuman untuk saat ini.</div>';
        }
      } catch (err) {
        Shell.showError('Tidak dapat terhubung ke server.');
      } finally {
        stopSpin();
      }
    }
    function refresh() { load(); }
    load();
  </script>
</body>
</html>
