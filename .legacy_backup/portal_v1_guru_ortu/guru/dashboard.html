<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Guru - Yayasan Samarinda</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter','system-ui','sans-serif'] }, colors: { primary: { 50:'#F0F9FF',500:'#0EA5E9',600:'#0284C7',700:'#0369A1',800:'#075985',900:'#0C4A6E' } } } } }
  </script>
  <link rel="stylesheet" href="../../public/css/style.css">
  <style>
    .skeleton { background: linear-gradient(90deg, #f3f4f6 0%, #e5e7eb 50%, #f3f4f6 100%); background-size: 200% 100%; animation: shimmer 1.4s ease-in-out infinite; }
    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    #mobile-nav { transition: transform 0.25s ease; }
    #mobile-nav[aria-hidden="true"] { transform: translateX(-100%); }
    .nav-item { display:flex; align-items:center; gap:0.75rem; padding:0.5rem 0.75rem; font-size:0.875rem; font-weight:500; border-radius:0.375rem; color:#374151; }
    .nav-item:hover { background-color:#F9FAFB; }
    .nav-active { background-color:#F0F9FF; color:#0369A1; }
  </style>
</head>
<body class="font-sans bg-gray-50 text-gray-800">
  <div id="app-shell"></div>

  <main class="p-4 sm:p-6 lg:p-8">
    <div id="error-banner" role="alert" class="hidden mb-4 p-4 bg-red-50 border border-red-200 rounded-md flex items-start justify-between gap-3">
      <div class="min-w-0">
        <div class="text-sm font-medium text-red-800">Gagal memuat data dashboard</div>
        <div id="error-message" class="text-xs text-red-700 mt-1 break-words"></div>
      </div>
      <button onclick="refresh()" class="shrink-0 text-sm font-medium text-red-700 hover:text-red-900 underline">Coba lagi</button>
    </div>

    <div class="grid grid-cols-2 sm:grid-cols-3 gap-4 mb-6">
      <div class="bg-white border border-gray-200 rounded-lg p-5 min-w-0">
        <div class="text-sm text-gray-600 truncate">Kelas Diampu</div>
        <div class="text-2xl font-bold text-gray-900 tabular-nums truncate" id="stat-classes"><div class="skeleton h-7 w-12 rounded"></div></div>
        <div class="text-xs text-gray-500 mt-1 truncate">Wali kelas</div>
      </div>
      <div class="bg-white border border-gray-200 rounded-lg p-5 min-w-0">
        <div class="text-sm text-gray-600 truncate">Total Siswa</div>
        <div class="text-2xl font-bold text-gray-900 tabular-nums truncate" id="stat-students"><div class="skeleton h-7 w-16 rounded"></div></div>
      </div>
      <div class="bg-white border border-gray-200 rounded-lg p-5 min-w-0">
        <div class="text-sm text-gray-600 truncate">Presensi Hari Ini</div>
        <div class="text-2xl font-bold text-gray-900 tabular-nums truncate" id="stat-attendance"><div class="skeleton h-7 w-20 rounded"></div></div>
        <div class="text-xs text-gray-500 mt-1 truncate">Sudah diinput</div>
      </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
      <div class="bg-white border border-gray-200 rounded-lg p-5">
        <h2 class="text-base font-semibold text-gray-900 mb-3">Akses Cepat</h2>
        <div class="space-y-2">
          <a href="presensi.html" class="flex items-center justify-between p-3 bg-gray-50 hover:bg-gray-100 rounded-md text-sm">
            <span>Input Presensi Hari Ini</span>
            <span class="text-primary-700">→</span>
          </a>
          <a href="development.html" class="flex items-center justify-between p-3 bg-gray-50 hover:bg-gray-100 rounded-md text-sm">
            <span>Catatan Perkembangan</span>
            <span class="text-primary-700">→</span>
          </a>
          <a href="students.html" class="flex items-center justify-between p-3 bg-gray-50 hover:bg-gray-100 rounded-md text-sm">
            <span>Daftar Siswa</span>
            <span class="text-primary-700">→</span>
          </a>
        </div>
      </div>

      <div class="bg-white border border-gray-200 rounded-lg p-5">
        <h2 class="text-base font-semibold text-gray-900 mb-3">Pengumuman</h2>
        <div id="ann-list" class="text-sm text-gray-600">Memuat...</div>
      </div>
    </div>
  </main>

  <script src="../../shared/js/auth.js"></script>
  <script src="../../shared/js/api.js"></script>
  <script src="../../shared/js/shell.js"></script>
  <script>
    requireAuth('guru,admin_tu,super_admin');

    const MENU = [
      { href: 'dashboard.html', label: 'Dashboard' },
      { href: 'presensi.html', label: 'Presensi' },
      { href: 'development.html', label: 'Catatan Perkembangan' },
      { href: 'students.html', label: 'Siswa' },
      { href: 'profile.html', label: 'Profil' }
    ];

    Shell.init({
      menu: MENU,
      active: 'dashboard.html',
      portalLabel: 'Portal Guru',
      title: 'Dashboard Guru',
      subtitle: 'Selamat mengajar',
      showRefresh: true,
      onRefresh: load
    });

    function setText(id, val) {
      const el = document.getElementById(id);
      if (!el) return;
      el.textContent = (val === null || val === undefined || val === '') ? '-' : val;
    }

    async function load() {
      Shell.hideError();
      const stopSpin = Shell.startRefresh();
      try {
        const me = await apiCall('teachers', 'me');
        if (me.success) {
          const meData = me.data || {};
          const students = meData.students || [];
          const classes = meData.classes || [];
          setText('stat-classes', classes.length);
          setText('stat-students', students.length);
        }
        const today = new Date().toISOString().slice(0, 10);
        const att = await apiCall('attendance', 'summary', { date: today });
        if (att.success) {
          const d = att.data || {};
          const hadir = d.hadir != null ? d.hadir : 0;
          const total = d.total_meetings != null ? d.total_meetings : (d.total_students || 0);
          setText('stat-attendance', hadir + '/' + total);
        }
        const ann = await apiCall('announcements', 'list', { per_page: 5 });
        if (ann.success) {
          const items = ann.data || [];
          document.getElementById('ann-list').innerHTML = items.length === 0
            ? '<div class="text-gray-500">Tidak ada pengumuman.</div>'
            : items.map(a => `<div class="py-2 border-b border-gray-100 last:border-0"><div class="font-medium text-gray-900">${a.title}</div><div class="text-xs text-gray-500">${formatDate(a.published_at || a.created_at)}</div></div>`).join('');
        }
      } catch (err) {
        Shell.showError('Tidak dapat terhubung ke server.');
      } finally {
        stopSpin();
      }
    }
    function refresh() { load(); }
    load();
  </script>
</body>
</html>
