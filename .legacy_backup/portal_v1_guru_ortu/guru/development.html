<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catatan Perkembangan - Yayasan Samarinda</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter','system-ui','sans-serif'] }, colors: { primary: { 50:'#F0F9FF',500:'#0EA5E9',600:'#0284C7',700:'#0369A1',800:'#075985',900:'#0C4A6E' } } } } }
  </script>
  <link rel="stylesheet" href="../../public/css/style.css">
</head>
<body class="font-sans bg-gray-50 text-gray-800">
  <div id="app-shell"></div>

  <main class="p-4 sm:p-6 lg:p-8">
    <div class="bg-white border border-gray-200 rounded-lg p-4 mb-4">
      <div class="grid sm:grid-cols-2 lg:grid-cols-4 gap-3">
        <select id="dev-student" class="px-3 py-2 border border-gray-300 rounded-md text-sm"></select>
        <select id="dev-semester" class="px-3 py-2 border border-gray-300 rounded-md text-sm"><option value="1">Semester 1 (Ganjil)</option><option value="2">Semester 2 (Genap)</option></select>
        <input id="dev-year" type="text" placeholder="2026" class="px-3 py-2 border border-gray-300 rounded-md text-sm">
        <button onclick="loadExisting()" class="px-4 py-2 bg-primary-600 text-white text-sm font-medium rounded-md hover:bg-primary-700">Load</button>
      </div>
    </div>

    <div id="form-area" class="hidden bg-white border border-gray-200 rounded-lg p-5">
      <form id="dev-form" class="space-y-4">
        <div class="grid sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">1. Nilai Agama & Budi Pekerti</label>
            <select name="nilai_agama" class="predikat w-full px-3 py-2 border border-gray-300 rounded-md text-sm">
              <option value="BB">BB - Belum Berkembang</option><option value="MB">MB - Mulai Berkembang</option>
              <option value="BSH">BSH - Berkembang Sesuai Harapan</option><option value="BSB">BSB - Berkembang Sangat Baik</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">2. Fisik-Motorik</label>
            <select name="fisik_motorik" class="predikat w-full px-3 py-2 border border-gray-300 rounded-md text-sm">
              <option value="BB">BB</option><option value="MB">MB</option><option value="BSH">BSH</option><option value="BSB">BSB</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">3. Kognitif</label>
            <select name="kognitif" class="predikat w-full px-3 py-2 border border-gray-300 rounded-md text-sm">
              <option value="BB">BB</option><option value="MB">MB</option><option value="BSH">BSH</option><option value="BSB">BSB</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">4. Bahasa</label>
            <select name="bahasa" class="predikat w-full px-3 py-2 border border-gray-300 rounded-md text-sm">
              <option value="BB">BB</option><option value="MB">MB</option><option value="BSH">BSH</option><option value="BSB">BSB</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">5. Sosial-Emosional</label>
            <select name="sosial_emosional" class="predikat w-full px-3 py-2 border border-gray-300 rounded-md text-sm">
              <option value="BB">BB</option><option value="MB">MB</option><option value="BSH">BSH</option><option value="BSB">BSB</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">6. Seni</label>
            <select name="seni" class="predikat w-full px-3 py-2 border border-gray-300 rounded-md text-sm">
              <option value="BB">BB</option><option value="MB">MB</option><option value="BSH">BSH</option><option value="BSB">BSB</option>
            </select>
          </div>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Catatan Guru</label>
          <textarea name="teacher_note" rows="3" class="w-full px-3 py-2 border border-gray-300 rounded-md text-sm" placeholder="Observasi umum, rekomendasi, dll."></textarea>
        </div>
        <div class="flex justify-end gap-2 pt-3 border-t border-gray-200">
          <button type="submit" class="px-4 py-2 bg-primary-600 text-white text-sm rounded-md hover:bg-primary-700">Simpan</button>
        </div>
      </form>
    </div>
  </main>

  <script src="../../shared/js/auth.js"></script>
  <script src="../../shared/js/api.js"></script>
  <script src="../../shared/js/shell.js"></script>
  <script>
    requireAuth('guru,admin_tu,super_admin');

    const MENU = [
      { href: 'dashboard.html', label: 'Dashboard' },
      { href: 'presensi.html', label: 'Presensi' },
      { href: 'development.html', label: 'Catatan Perkembangan' },
      { href: 'students.html', label: 'Siswa' },
      { href: 'profile.html', label: 'Profil' }
    ];

    Shell.init({
      menu: MENU,
      active: 'development.html',
      portalLabel: 'Portal Guru',
      title: 'Catatan Perkembangan',
      subtitle: 'Penilaian 6 aspek perkembangan PAUD/TK',
      showRefresh: true,
      onRefresh: loadExisting
    });

    // Default current year
    document.getElementById('dev-year').value = new Date().getFullYear();

    async function loadStudents() {
      const me = await apiCall('teachers', 'me');
      const sel = document.getElementById('dev-student');
      let studentList = [];
      if (me.success && me.data.students && me.data.students.length > 0) {
        studentList = me.data.students;
      } else {
        const r = await apiCall('students', 'list', { per_page: 100 });
        if (r.success && r.data && r.data.length > 0) studentList = r.data;
      }
      if (studentList.length === 0) {
        sel.innerHTML = '<option value="">Belum ada siswa</option>';
        return;
      }
      sel.innerHTML = '<option value="">- Pilih siswa -</option>' + studentList.map(s => `<option value="${s.id}">${s.full_name}</option>`).join('');
      // Auto-pick dari ?student_id= jika ada, lalu load nilai
      const preId = new URLSearchParams(window.location.search).get('student_id');
      if (preId && studentList.find(s => s.id === preId)) {
        sel.value = preId;
        loadExisting();
      }
    }

    async function loadExisting() {
      const studentId = document.getElementById('dev-student').value;
      const semester = document.getElementById('dev-semester').value;
      const year = document.getElementById('dev-year').value;
      if (!studentId) { showToast('Pilih siswa terlebih dahulu', 'warning'); return; }

      Shell.hideError();
      const stopSpin = Shell.startRefresh();
      try {
        const res = await apiCall('development', 'list', { student_id: studentId, semester, year });
        document.getElementById('form-area').classList.remove('hidden');
        // apiCall auto-unwrap ke array, jadi res.data sudah array of records
        if (res.success && Array.isArray(res.data) && res.data.length > 0) {
          const r = res.data[0];
          // Backend pakai aspect_nam/.../teacher_notes; frontend form pakai nilai_agama/.../teacher_note
          const aliasMap = { 'nilai_agama': 'aspect_nam', 'fisik_motorik': 'aspect_fisik_motorik', 'kognitif': 'aspect_kognitif', 'bahasa': 'aspect_bahasa', 'sosial_emosional': 'aspect_sosial_emosional', 'seni': 'aspect_seni' };
          document.querySelectorAll('.predikat').forEach(sel => {
            const name = sel.name; // nama field UI: nilai_agama, fisik_motorik, dst
            const serverKey = aliasMap[name] || name;
            const v = r[serverKey] != null ? r[serverKey] : r[name];
            if (v) sel.value = v;
          });
          document.querySelector('[name="teacher_note"]').value = r.teacher_notes || r.teacher_note || '';
        } else {
          document.getElementById('dev-form').reset();
        }
      } catch (e) {
        Shell.showError('Tidak dapat terhubung ke server.');
      } finally {
        stopSpin();
      }
    }

    document.getElementById('dev-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const submitBtn = e.target.querySelector('button[type="submit"]');
      if (submitBtn) { submitBtn.disabled = true; submitBtn.textContent = 'Menyimpan...'; }

      const fd = new FormData(e.target);
      // Map UI field names ke server canonical names
      const data = {
        student_id: document.getElementById('dev-student').value,
        semester: document.getElementById('dev-semester').value,
        academic_year: document.getElementById('dev-year').value,
        aspect_nam: fd.get('nilai_agama'),
        aspect_fisik_motorik: fd.get('fisik_motorik'),
        aspect_kognitif: fd.get('kognitif'),
        aspect_bahasa: fd.get('bahasa'),
        aspect_sosial_emosional: fd.get('sosial_emosional'),
        aspect_seni: fd.get('seni'),
        teacher_notes: fd.get('teacher_note')
      };
      try {
        const res = await apiCall('development', 'upsert', data);
        showToast(res.message, res.success ? 'success' : 'error');
        if (res.success) loadExisting();
      } catch (err) {
        showToast('Gagal menyimpan catatan', 'error');
      } finally {
        if (submitBtn) { submitBtn.disabled = false; submitBtn.textContent = 'Simpan'; }
      }
    });

    loadStudents();
  </script>
</body>
</html>
