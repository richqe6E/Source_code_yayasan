<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Presensi - Yayasan Samarinda</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter','system-ui','sans-serif'] }, colors: { primary: { 50:'#F0F9FF',500:'#0EA5E9',600:'#0284C7',700:'#0369A1',800:'#075985',900:'#0C4A6E' } } } } }
  </script>
  <link rel="stylesheet" href="../../public/css/style.css">
</head>
<body class="font-sans bg-gray-50 text-gray-800">
  <div id="app-shell"></div>

  <main class="p-4 sm:p-6 lg:p-8">
    <div class="bg-white border border-gray-200 rounded-lg p-4 mb-4">
      <div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-3">
        <div>
          <label class="block text-xs font-medium text-gray-700 mb-1">Tanggal</label>
          <input id="att-date" type="date" class="w-full px-3 py-2 border border-gray-300 rounded-md text-sm">
        </div>
        <div>
          <label class="block text-xs font-medium text-gray-700 mb-1">Kelas</label>
          <select id="att-class" class="w-full px-3 py-2 border border-gray-300 rounded-md text-sm"></select>
        </div>
        <div class="flex items-end">
          <button onclick="loadRoster()" class="w-full px-4 py-2 bg-primary-600 text-white text-sm font-medium rounded-md hover:bg-primary-700">Tampilkan</button>
        </div>
      </div>
    </div>

    <div id="roster-area" class="hidden bg-white border border-gray-200 rounded-lg overflow-hidden">
      <div class="px-4 py-3 border-b border-gray-200 flex justify-between items-center gap-2">
        <div class="text-sm font-semibold text-gray-900 truncate">Daftar Siswa</div>
        <button onclick="saveAttendance()" class="px-3 py-1.5 bg-green-600 text-white text-sm rounded-md hover:bg-green-700 shrink-0">Simpan Presensi</button>
      </div>
      <div class="overflow-x-auto">
        <table class="min-w-full divide-y divide-gray-200">
          <thead class="bg-gray-50"><tr><th class="px-4 py-3 text-left text-xs font-semibold text-gray-600 uppercase">Nama</th><th class="px-4 py-3 text-left text-xs font-semibold text-gray-600 uppercase">Status</th><th class="px-4 py-3 text-left text-xs font-semibold text-gray-600 uppercase">Catatan</th></tr></thead>
          <tbody id="roster-tbody" class="bg-white divide-y divide-gray-200"></tbody>
        </table>
      </div>
    </div>
  </main>

  <script src="../../shared/js/auth.js"></script>
  <script src="../../shared/js/api.js"></script>
  <script src="../../shared/js/shell.js"></script>
  <script>
    requireAuth('guru,admin_tu,super_admin');

    const MENU = [
      { href: 'dashboard.html', label: 'Dashboard' },
      { href: 'presensi.html', label: 'Presensi' },
      { href: 'development.html', label: 'Catatan Perkembangan' },
      { href: 'students.html', label: 'Siswa' },
      { href: 'profile.html', label: 'Profil' }
    ];

    Shell.init({
      menu: MENU,
      active: 'presensi.html',
      portalLabel: 'Portal Guru',
      title: 'Presensi Siswa',
      subtitle: 'Input kehadiran harian',
      showRefresh: true,
      onRefresh: loadRoster
    });

    document.getElementById('att-date').value = new Date().toISOString().slice(0, 10);

    async function loadClasses(preselectStudentId) {
      const me = await apiCall('teachers', 'me');
      const sel = document.getElementById('att-class');
      let classes = [];
      if (me.success && me.data.classes && me.data.classes.length > 0) {
        classes = me.data.classes;
        sel.innerHTML = classes.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
      } else {
        const all = await apiCall('classes', 'list', { per_page: 100 });
        if (all.success && all.data && all.data.length > 0) {
          classes = all.data;
          sel.innerHTML = classes.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
        } else {
          sel.innerHTML = '<option value="">Belum ada kelas</option>';
          return;
        }
      }
      // Auto-pick kelas dari ?student_id= jika ada
      if (preselectStudentId) {
        try {
          const sr = await apiCall('students', 'get', { id: preselectStudentId });
          if (sr.success && sr.data && sr.data.class_id) {
            sel.value = sr.data.class_id;
          }
        } catch (_) { /* diam jika gagal */ }
      }
      loadRoster();
    }

    async function loadRoster() {
      const date = document.getElementById('att-date').value;
      const classId = document.getElementById('att-class').value;
      if (!date || !classId) { showToast('Pilih tanggal & kelas', 'warning'); return; }

      Shell.hideError();
      const stopSpin = Shell.startRefresh();
      document.getElementById('roster-area').classList.remove('hidden');
      const tbody = document.getElementById('roster-tbody');
      tbody.innerHTML = Shell.skeletonRows(3, 4);

      try {
        const res = await apiCall('attendance', 'roster', { date, class_id: classId });
        if (!res.success) {
          Shell.showError(res.message || 'Gagal memuat daftar siswa');
          tbody.innerHTML = `<tr><td colspan="3" class="px-4 py-6 text-center text-sm text-red-600">${res.message || 'Gagal'}</td></tr>`;
          return;
        }
        const studentList = Array.isArray(res.data) ? res.data : (res.data.students || res.data.items || (res.raw && (res.raw.students || res.raw.items)) || []);
        if (!studentList || studentList.length === 0) {
          tbody.innerHTML = '<tr><td colspan="3" class="px-4 py-6 text-center text-sm text-gray-500">Tidak ada siswa di kelas ini</td></tr>';
          return;
        }
        tbody.innerHTML = studentList.map(s => `
          <tr>
            <td class="px-4 py-3 text-sm text-gray-900 min-w-0 font-medium truncate">${s.full_name || s.name} <span class="text-xs text-gray-500 tabular-nums">(${s.nis || '-'})</span></td>
            <td class="px-4 py-3 whitespace-nowrap">
              <select data-id="${s.id}" class="att-status px-2.5 py-1.5 border border-gray-300 rounded text-sm focus:ring-1 focus:ring-primary-500">
                <option value="hadir">Hadir</option><option value="izin">Izin</option><option value="sakit">Sakit</option><option value="alpha">Alpha</option>
              </select>
            </td>
            <td class="px-4 py-3 min-w-0"><input data-id="${s.id}" class="att-note px-2.5 py-1.5 border border-gray-300 rounded text-sm w-full" placeholder="Opsional (catatan)"></td>
          </tr>`).join('');

        // Pre-fill existing
        const existingList = (res.raw && res.raw.existing) || (res.data && res.data.existing) || [];
        existingList.forEach(e => {
          const sel = tbody.querySelector(`select[data-id="${e.student_id}"]`);
          const inp = tbody.querySelector(`input[data-id="${e.student_id}"]`);
          // Backend pakai H/I/S/A (huruf besar); frontend pakai hadir/izin/sakit/alpha
          const codeMap = { 'H': 'hadir', 'I': 'izin', 'S': 'sakit', 'A': 'alpha', 'hadir': 'hadir', 'izin': 'izin', 'sakit': 'sakit', 'alpha': 'alpha' };
          const normalized = codeMap[e.status] || codeMap[String(e.status).toLowerCase()] || 'hadir';
          if (sel) sel.value = normalized;
          if (inp) inp.value = e.notes || e.note || '';
        });
      } catch (e) {
        Shell.showError('Tidak dapat terhubung ke server.');
      } finally {
        stopSpin();
      }
    }

    async function saveAttendance() {
      const date = document.getElementById('att-date').value;
      const classId = document.getElementById('att-class').value;
      const rows = [...document.querySelectorAll('#roster-tbody tr')].map(tr => {
        const sel = tr.querySelector('.att-status');
        const note = tr.querySelector('.att-note');
        return sel ? {
          student_id: sel.dataset.id,
          status: sel.value,
          notes: note ? note.value : ''
        } : null;
      }).filter(Boolean);

      if (rows.length === 0) return;
      const btn = event?.target;
      if (btn) { btn.disabled = true; btn.textContent = 'Menyimpan...'; }
      try {
        const res = await apiCall('attendance', 'submit', { class_id: classId, date: date, records: rows });
        showToast(res.message, res.success ? 'success' : 'error');
      } catch (e) {
        showToast('Gagal menyimpan presensi', 'error');
      } finally {
        if (btn) { btn.disabled = false; btn.textContent = 'Simpan Presensi'; }
      }
    }

    loadClasses(new URLSearchParams(window.location.search).get('student_id'));
  </script>
</body>
</html>
