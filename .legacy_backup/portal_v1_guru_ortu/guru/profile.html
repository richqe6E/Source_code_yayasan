<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profil Guru - Yayasan Samarinda</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter','system-ui','sans-serif'] }, colors: { primary: { 50:'#F0F9FF',500:'#0EA5E9',600:'#0284C7',700:'#0369A1',800:'#075985',900:'#0C4A6E' } } } } }
  </script>
  <link rel="stylesheet" href="../../public/css/style.css">
</head>
<body class="font-sans bg-gray-50 text-gray-800 antialiased">
  <div id="app-shell"></div>

  <main class="p-4 sm:p-6 lg:p-8 max-w-4xl">
    <div id="error-banner" class="hidden mb-4 p-4 rounded-lg bg-red-50 border border-red-200 text-red-800 text-sm flex items-center justify-between">
      <div class="flex items-center gap-2">
        <svg class="w-5 h-5 text-red-600 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        <span id="error-message">Terjadi kesalahan</span>
      </div>
      <button onclick="loadTeacher()" class="text-xs font-semibold px-2.5 py-1 bg-red-100 hover:bg-red-200 rounded text-red-800">Coba Lagi</button>
    </div>

    <div class="bg-white border border-gray-200 rounded-lg p-6 mb-6 shadow-sm">
      <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 mb-6 pb-6 border-b border-gray-100">
        <div class="flex items-center gap-4">
          <div class="relative group">
            <div id="avatar-container" class="w-20 h-20 bg-primary-600 rounded-full flex items-center justify-center text-white text-2xl font-bold shadow overflow-hidden border-2 border-primary-100">
              <span id="avatar">G</span>
              <img id="avatar-img" class="hidden w-full h-full object-cover" alt="Foto Guru">
            </div>
            <label for="teacher-photo-input" class="absolute bottom-0 right-0 p-1.5 bg-primary-600 hover:bg-primary-700 text-white rounded-full shadow-md cursor-pointer transition transform hover:scale-105" title="Ganti Foto Profil">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
            </label>
            <input type="file" id="teacher-photo-input" accept="image/*" class="hidden">
          </div>
          <div class="min-w-0">
            <div class="text-lg font-bold text-gray-900 truncate" id="name">-</div>
            <div class="text-sm text-gray-600 truncate" id="email">-</div>
            <div class="inline-flex items-center px-2 py-0.5 mt-1 rounded text-xs font-medium bg-primary-50 text-primary-700 capitalize" id="role">-</div>
          </div>
        </div>
        <label for="teacher-photo-input" class="cursor-pointer inline-flex items-center gap-1.5 px-3 py-1.5 border border-gray-300 rounded-md text-xs font-semibold text-gray-700 bg-white hover:bg-gray-50 shadow-sm transition">
          <svg class="w-4 h-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
          Ubah Foto Profil
        </label>
      </div>

      <form id="profile-form" class="grid sm:grid-cols-2 gap-4">
        <div class="sm:col-span-2">
          <h3 class="text-sm font-semibold text-gray-900 mb-2">Informasi Akun &amp; Guru</h3>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Nama Lengkap</label>
          <input id="f-name" class="w-full px-3 py-2 border border-gray-300 rounded-md text-sm focus:ring-2 focus:ring-primary-500 focus:border-transparent">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
          <input id="f-email" disabled class="w-full px-3 py-2 border border-gray-200 rounded-md text-sm bg-gray-50 text-gray-500 cursor-not-allowed">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">No HP / WhatsApp</label>
          <input id="f-phone" placeholder="08..." class="w-full px-3 py-2 border border-gray-300 rounded-md text-sm focus:ring-2 focus:ring-primary-500 focus:border-transparent">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Spesialisasi / Mata Pelajaran</label>
          <input id="f-spec" placeholder="Contoh: Guru Kelas / Tahfidz" class="w-full px-3 py-2 border border-gray-300 rounded-md text-sm focus:ring-2 focus:ring-primary-500 focus:border-transparent">
        </div>
        <div class="sm:col-span-2 pt-2">
          <button type="submit" id="save-profile-btn" class="px-5 py-2.5 bg-primary-600 text-white text-sm font-semibold rounded-md hover:bg-primary-700 shadow-sm transition-colors">
            Simpan Perubahan
          </button>
        </div>
      </form>
    </div>

    <div class="bg-white border border-gray-200 rounded-lg p-6 shadow-sm">
      <h3 class="text-sm font-semibold text-gray-900 mb-1">Keamanan Akun</h3>
      <p class="text-xs text-gray-500 mb-4">Perbarui password akun Anda secara berkala.</p>

      <form id="pwd-form" class="space-y-4 max-w-sm">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Password Lama</label>
          <input id="p-old" type="password" required class="w-full px-3 py-2 border border-gray-300 rounded-md text-sm focus:ring-2 focus:ring-primary-500 focus:border-transparent">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Password Baru</label>
          <input id="p-new" type="password" required minlength="6" class="w-full px-3 py-2 border border-gray-300 rounded-md text-sm focus:ring-2 focus:ring-primary-500 focus:border-transparent">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Konfirmasi Password Baru</label>
          <input id="p-conf" type="password" required minlength="6" class="w-full px-3 py-2 border border-gray-300 rounded-md text-sm focus:ring-2 focus:ring-primary-500 focus:border-transparent">
        </div>
        <button type="submit" id="pwd-btn" class="px-4 py-2 bg-gray-800 text-white text-sm font-semibold rounded-md hover:bg-gray-900 transition-colors">
          Ubah Password
        </button>
      </form>
    </div>
  </main>

  <script src="../../shared/js/auth.js"></script>
  <script src="../../shared/js/api.js"></script>
  <script src="../../shared/js/shell.js"></script>
  <script>
    requireAuth();

    const MENU = [
      { href: 'dashboard.html', label: 'Dashboard' },
      { href: 'presensi.html', label: 'Presensi' },
      { href: 'development.html', label: 'Catatan Perkembangan' },
      { href: 'students.html', label: 'Siswa' },
      { href: 'profile.html', label: 'Profil' }
    ];

    Shell.init({
      menu: MENU,
      active: 'profile.html',
      portalLabel: 'Portal Guru',
      title: 'Profil Saya',
      subtitle: 'Kelola data pribadi dan keamanan akun',
      showRefresh: true,
      onRefresh: () => {
        syncCurrentUser();
        loadTeacher();
      }
    });

    function syncCurrentUser() {
      const u = getCurrentUser();
      if (u) {
        document.getElementById('name').textContent = u.full_name || 'Guru';
        document.getElementById('email').textContent = u.email || '-';
        document.getElementById('role').textContent = u.role || 'guru';
        document.getElementById('f-name').value = u.full_name || '';
        document.getElementById('f-email').value = u.email || '';

        const avText = document.getElementById('avatar');
        const avImg = document.getElementById('avatar-img');
        const photo = u.avatar_url || u.photo_url;
        if (photo) {
          avImg.src = photo;
          avImg.classList.remove('hidden');
          avText.classList.add('hidden');
        } else {
          avText.textContent = (u.full_name || 'G').charAt(0).toUpperCase();
          avText.classList.remove('hidden');
          avImg.classList.add('hidden');
        }
      }
    }
    syncCurrentUser();

    document.getElementById('teacher-photo-input').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      if (file.size > 3 * 1024 * 1024) {
        showToast('Ukuran foto maksimal 3MB', 'warning');
        return;
      }
      showToast('Mengunggah foto profil guru...', 'info');
      try {
        const photoUrl = await window.uploadToStorage(file, 'teachers');
        if (!photoUrl) {
          showToast('Gagal mengunggah foto ke penyimpanan', 'error');
          return;
        }
        const res = await apiCall('teachers', 'update', { photo_url: photoUrl, avatar_url: photoUrl });
        if (res.success) {
          showToast('Foto profil berhasil diperbarui!', 'success');
          const u = getCurrentUser() || {};
          u.avatar_url = photoUrl;
          u.photo_url = photoUrl;
          localStorage.setItem('siy_user', JSON.stringify(u));
          syncCurrentUser();
        } else {
          showToast(res.message || 'Gagal menyimpan foto profil', 'error');
        }
      } catch (err) {
        showToast('Gagal mengunggah foto profil', 'error');
      }
    });

    async function loadTeacher() {
      const errBanner = document.getElementById('error-banner');
      errBanner.classList.add('hidden');
      try {
        const res = await apiCall('teachers', 'me');
        if (res.success && res.data) {
          const t = res.data.teacher || res.data;
          document.getElementById('f-phone').value = t.phone || '';
          document.getElementById('f-spec').value = t.specialization || '';
          if (t.photo_url) {
            const u = getCurrentUser() || {};
            u.photo_url = t.photo_url;
            if (!u.avatar_url) u.avatar_url = t.photo_url;
            localStorage.setItem('siy_user', JSON.stringify(u));
            syncCurrentUser();
          }
        }
      } catch (e) {
        errBanner.classList.remove('hidden');
        document.getElementById('error-message').textContent = 'Gagal memuat detail data guru';
      }
    }
    loadTeacher();

    document.getElementById('profile-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('save-profile-btn');
      const originalText = btn.textContent;
      btn.disabled = true;
      btn.textContent = 'Menyimpan...';

      try {
        const res = await apiCall('teachers', 'update', {
          full_name: document.getElementById('f-name').value,
          phone: document.getElementById('f-phone').value,
          specialization: document.getElementById('f-spec').value
        });
        showToast(res.message || (res.success ? 'Profil berhasil diperbarui' : 'Gagal memperbarui profil'), res.success ? 'success' : 'error');
        if (res.success) {
          const u = getCurrentUser() || {};
          u.full_name = document.getElementById('f-name').value;
          localStorage.setItem('siy_user', JSON.stringify(u));
          syncCurrentUser();
        }
      } catch (err) {
        showToast('Koneksi terganggu', 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = originalText;
      }
    });

    document.getElementById('pwd-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const oldP = document.getElementById('p-old').value;
      const newP = document.getElementById('p-new').value;
      const conf = document.getElementById('p-conf').value;
      if (newP !== conf) {
        showToast('Password baru dan konfirmasi tidak cocok', 'error');
        return;
      }

      const btn = document.getElementById('pwd-btn');
      const originalText = btn.textContent;
      btn.disabled = true;
      btn.textContent = 'Memproses...';

      try {
        const res = await apiCall('auth', 'change_password', { old_password: oldP, new_password: newP });
        showToast(res.message || (res.success ? 'Password berhasil diubah' : 'Gagal mengubah password'), res.success ? 'success' : 'error');
        if (res.success) e.target.reset();
      } catch (err) {
        showToast('Koneksi terganggu', 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = originalText;
      }
    });
  </script>
</body>
</html>
